    forEach(fn) { this.docs.forEach(fn); }
  });

  function query(name) {
    const api = {
      where: () => api, orderBy: () => api, limit: () => api,
      get: async () => {
        window.__reads = (window.__reads || []).concat(name);
        if (name === 'sectors' && Q.get('sectorsFail') === '1') throw new Error('permission-denied');

      },
      doc: id0 => {
        const id = id0 || ('auto' + (++auto));

          id, __name: name, __id: id,
          update: async d => { window.__writes.push([name, id, 'update', d]); const row = (window.__data[name] || []).find(r => r.id === id); if (row) Object.assign(row, d); },

        };
      },
      add: async d => { window.__writes.push([name, null, 'add', d]); return { id: 'new' }; }
    };
    return api;
  }

  if (NET === 'both' && Q.get('choice')) { try { localStorage.setItem('orford-network', JSON.stringify({ id: Q.get('choice'), season: Network.ofSeason() })); } catch (e) {} }
  else { try { localStorage.removeItem('orford-network'); } catch (e) {} }
  // never start a test carrying over a kind choice made by a previous test in the same browser profile
  try { localStorage.removeItem('orford-kind'); } catch (e) {}
  // ?kind=downhill: start already on that kind, like a user who switched then reloaded
  if (Q.get('kind')) { try { localStorage.setItem('orford-kind', JSON.stringify({ network: NET === 'both' ? (Q.get('choice') || 'ski') : NET, kind: Q.get('kind') })); } catch (e) {} }
  Network.reload = () => { window.__reloads++; };
  // what the real auth.js does once the user is known
  function checkAuthStatus(opts) {
    if (!Network.setUser(currentUserData)) { document.body.textContent = 'ACCESS DENIED (no activity)'; return; }
    const l = document.getElementById('loading'); if (l) l.style.display = 'none';
    const m = document.getElementById('main-content'); if (m) m.style.display = 'block';
    if (typeof updateUIForUser === 'function') updateUIForUser(currentUserData);
    return opts.onAuthenticated(currentUserData);
  }
  function onFirebaseReady(cb) { cb(); }
  function getAuthErrorMessage(e) { return e.message; }
</script>
