<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WeatherService tests</title></head>
<body>
<pre id="out">running...</pre>
<script src="/js/core/config.js"></script>
<script src="/js/services/weather-service.js"></script>
<script>
// The Météo data layer: Environment Canada readings (canned answers, taken from real readings of 2026-10-09),
// the feels-like, validation, what is stored, and the Firestore calls (a fake Firestore).
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const WS = WeatherService;
  const T0 = Date.parse('2026-10-09T20:30:00Z');

  // ---- real readings (trimmed) ----
  const LAC = { 'stn_nam-value': 'LAC MEMPHREMAGOG', 'date_tm-value': '2026-10-09T20:00:00.000Z', air_temp: 8.4, rel_hum: 86, dwpt_temp: 6.2,
    avg_wnd_spd_10m_pst10mts: 15.4, avg_wnd_dir_10m_pst10mts: 297, max_wnd_spd_10m_pst10mts: 24.4, max_wnd_spd_10m_pst1hr: 29.2 };
  const AIRPORT = { 'stn_nam-value': 'Sherbrooke', 'date_tm-value': '2026-10-09T20:00:00.000Z', air_temp: 7.9, rel_hum: 80, dwpt_temp: 4.7,
    mslp: 1020.1, avg_vis_pst10mts: 16.09, cld_amt_code_1: 1, cld_bas_hgt_1: 1310, cld_amt_code_2: 4,
    avg_wnd_spd_10m_pst10mts: 16.6, avg_wnd_dir_10m_pst10mts: 261, pcpn_amt_pst1hr: 0.0, pcpn_amt_pst24hrs: 3.3 };

  // ---- a fake fetch: answers per station id, records every URL ----
  let ANSWERS, URLS;
  const fakeFetch = async url => {
    URLS.push(url);
    const id = /msc_id-value=([^&]+)/.exec(url)[1];
    const a = ANSWERS[id];
    if (a instanceof Error) throw a;
    return { ok: !(a && a.status), status: a && a.status, json: async () => ({ features: a && a.props ? [{ properties: a.props }] : [] }) };
  };
  const answers = (lac, airport) => { ANSWERS = { '702CFGG': lac, '7028123': airport }; URLS = []; };

  // ---- config ----
  const cfg = APP_CONFIG.weather;
  ok('config: one place (Mont Orford) with the two Environment Canada stations, the lake first; only the lake is publishable',
    cfg.defaultLocation === 'mountain' && J(cfg.locations.mountain.stations.map(s => [s.id, s.mscId, s.publish])) === J([['lac', '702CFGG', true], ['sherbrooke', '7028123', false]]), cfg);

  // ---- the feels-like (Environment Canada's formulas) ----
  ok('feels-like: -10 °C with 20 km/h wind = wind chill -18', WS.feelsLike(-10, 20, null) === -18, WS.feelsLike(-10, 20, null));
  ok('feels-like: 30 °C with a 20 °C dew point = humidex 38', WS.feelsLike(30, 5, 20) === 38, WS.feelsLike(30, 5, 20));
  ok('feels-like: between 0 and 20 °C it is the air temperature itself', WS.feelsLike(8.4, 15.4, 6.2) === 8.4 && WS.feelsLike(0.5, 30, 0) === 0.5, null);
  ok('feels-like: cold but wind under 5 km/h = the air temperature; no temperature = nothing', WS.feelsLike(-5, 3, null) === -5 && WS.feelsLike(null, 20, null) === null, null);
  ok('feels-like: 22 °C and dry (humidex not above the temperature) = the temperature', WS.feelsLike(22, 5, 0) === 22, WS.feelsLike(22, 5, 0));
  ok('wind direction in words: 297° = ONO, 0° and 360° = N, 90° = E, 180° = S', WS.compass(297) === 'ONO' && WS.compass(0) === 'N' && WS.compass(360) === 'N' && WS.compass(90) === 'E' && WS.compass(180) === 'S' && WS.compass(null) === '', null);

  // ---- reading one station ----
  const lac = WS.mapObservation(LAC, 'ground');
  ok('lake station: temperature, humidity, wind (10 min), direction, gusts (the hour\'s maximum), dew point; nothing invented',
    lac.tempC === 8.4 && lac.humidityPct === 86 && lac.windKmh === 15.4 && lac.windDir === 297 && lac.gustKmh === 29.2 && lac.dewPointC === 6.2 && lac.pressureKpa === undefined && lac.cloudCover === undefined && lac.visibilityKm === undefined, lac);
  const air = WS.mapObservation(AIRPORT, 'airport');
  ok('airport: pressure in kPa (1020.1 hPa), visibility, clouds (a broken/overcast layer = overcast), rain only above freezing',
    air.pressureKpa === 102 && air.visibilityKm === 16.09 && air.cloudCover === 'overcast' && air.rainMm === 3.3, air);
  ok('airport: no precipitation, overcast: no sky suggestion; few clouds: "sun"', air.sky === undefined && WS.mapObservation(Object.assign({}, AIRPORT, { cld_amt_code_2: undefined }), 'airport').sky === 'sun', air.sky);
  const sky = (over) => WS.mapObservation(Object.assign({}, AIRPORT, over), 'airport').sky;
  ok('sky suggestion: rain above +1 °C, snow below, fog under 1 km of visibility, otherwise nothing special',
    sky({ pcpn_amt_pst1hr: 0.4, air_temp: 6 }) === 'rain' && sky({ pcpn_amt_pst1hr: 0.4, air_temp: -3 }) === 'snow' && sky({ avg_vis_pst10mts: 0.4 }) === 'fog', null);
  ok('airport: a clear sky has no cloud layer in a complete report; without the report nothing is claimed',
    WS.mapObservation({ air_temp: 5, avg_vis_pst10mts: 16 }, 'airport').cloudCover === 'clear' && WS.mapObservation({ air_temp: 5 }, 'airport').cloudCover === undefined, null);
  ok('airport: no rain value when it is freezing (the 24 h amount may be snow)', WS.mapObservation(Object.assign({}, AIRPORT, { air_temp: -2 }), 'airport').rainMm === undefined, null);
  ok('text numbers from the service are read as numbers', WS.mapObservation({ air_temp: '8.4', rel_hum: '86' }, 'ground').tempC === 8.4, null);

  // ---- the request ----
  const station = cfg.locations.mountain.stations[0];
  const url = WS.observationUrl(station, T0);
  ok('request: one station by its id, the 3 hours before the chosen time, newest first, a single reading',
    url.startsWith(cfg.api + '?f=json&msc_id-value=702CFGG&') && url.includes('datetime=2026-10-09T17:30:00Z/2026-10-09T20:30:00Z') && url.includes('sortby=-date_tm-value') && url.endsWith('limit=1'), url);

  // ---- both stations ----
  answers({ props: LAC }, { props: AIRPORT });
  const web = await WS.fetchWebValues({ at: T0, fetch: fakeFetch });
  const f = web.fields;
  ok('both read: temperature, wind, gusts and humidity from the lake; pressure, clouds, visibility from the airport', f.tempC.source === 'lac' && f.humidityPct.source === 'lac' && f.windKmh.source === 'lac' && f.gustKmh.source === 'lac' && f.pressureKpa.source === 'sherbrooke' && f.cloudCover.value === 'overcast' && f.visibilityKm.source === 'sherbrooke', J(Object.keys(f)));
  ok('...the airport never replaces a value the lake has (temperature stays 8.4, not 7.9)', f.tempC.value === 8.4 && f.windDir.value === 297, f.tempC);
  ok('...publishable only for the lake: lake values yes, airport values no', f.tempC.publishable === true && f.pressureKpa.publishable === false && f.rainMm.publishable === false, null);
  ok('...the feels-like is computed (here the temperature itself) and marked as calculated', f.feelsLikeC.value === 8.4 && f.feelsLikeC.source === 'calc' && f.feelsLikeC.publishable === true, f.feelsLikeC);
  ok('...the observation time is kept per value and overall', f.tempC.observedAt === Date.parse('2026-10-09T20:00:00.000Z') && web.observedAt === Date.parse('2026-10-09T20:00:00.000Z') && web.missing.length === 0 && web.errors.length === 0, web);
  ok('both stations were asked', URLS.length === 2 && URLS.some(u => u.includes('702CFGG')) && URLS.some(u => u.includes('7028123')), URLS);

  // ---- failures ----
  answers(new Error('network down'), { props: AIRPORT });
  const partial = await WS.fetchWebValues({ at: T0, fetch: fakeFetch });
  ok('the lake cannot be read: the airport still gives its values (not publishable), the failure is reported', partial.fields.tempC.source === 'sherbrooke' && partial.fields.tempC.publishable === false && partial.errors.length === 1 && partial.errors[0].station === 'lac', partial);
  answers({ status: 503 }, new Error('timeout'));
  let failed = null;
  try { await WS.fetchWebValues({ at: T0, fetch: fakeFetch }); } catch (e) { failed = e; }
  ok('every station fails (HTTP error): an error with a code, nothing invented', failed && failed.code === 'unreachable', failed && failed.message);
  answers({ props: null }, { props: null });
  const none = await WS.fetchWebValues({ at: T0, fetch: fakeFetch });
  ok('no observation in the window (e.g. a very old date): no values, both stations listed as missing, no error', Object.keys(none.fields).length === 0 && none.observedAt === null && J(none.missing) === J(['lac', 'sherbrooke']), none);

  // ---- validation ----
  const good = WS.validateManual({ tempC: ' -12,5 ', windKmh: '20', cloudCover: 'partly', sky: 'snow', newSnowCm: '', humidityPct: 85 });
  ok('typed values: comma accepted, text read as numbers, empty = nothing, every field present', good.ok && good.values.tempC === -12.5 && good.values.windKmh === 20 && good.values.humidityPct === 85 && good.values.newSnowCm === null && good.values.visibilityKm === null && Object.keys(good.values).length === WS.KEYS.length && good.values.cloudCover === 'partly', good);
  const bad = WS.validateManual({ tempC: '120', windDir: '400', humidityPct: 'abc', cloudCover: 'stormy', pressureKpa: '50' });
  ok('refused: out of range, not a number, unknown choice - each named', !bad.ok && ['tempC', 'windDir', 'humidityPct', 'cloudCover', 'pressureKpa'].every(k => !!bad.errors[k]) && /entre -60 et 50/.test(bad.errors.tempC) && /un nombre/.test(bad.errors.humidityPct), bad.errors);
  ok('zero is a value (0 cm of snow is not "nothing")', WS.validateManual({ newSnowCm: 0, snowDepthCm: '0' }).values.newSnowCm === 0 && WS.validateManual({ snowDepthCm: '0' }).values.snowDepthCm === 0, null);

  // ---- a record, as stored ----
  const user = { uid: 'u1', name: 'Marie' };
  const FB = { firestore: { Timestamp: { fromDate: d => ({ toDate: () => d, toMillis: () => d.getTime(), __ts: true }) }, FieldValue: { serverTimestamp: () => 'SERVER_TS' } } };
  const built = WS.buildRecord({ at: new Date(T0), manual: { newSnowCm: '12', snowDepthCm: '55' }, web, comment: '  Belle journée  ' }, user, FB);
  const r = built.record;
  ok('record: place, day and time, typed values (all fields, null where nothing), comment trimmed, author kept', built.ok && r.locationId === 'mountain' && r.recordedAt.toMillis() === T0 && r.manual.newSnowCm === 12 && r.manual.tempC === null && r.comment === 'Belle journée' && r.createdBy === 'u1' && r.createdByName === 'Marie' && r.createdAt === 'SERVER_TS', r);
  ok('record: the web values are kept as read (value, source, time, publishable) next to the typed ones', r.web.fields.tempC.value === 8.4 && r.web.fields.tempC.source === 'lac' && r.web.fields.tempC.observedAt.toMillis() === Date.parse('2026-10-09T20:00:00.000Z') && r.web.fields.pressureKpa.publishable === false && r.web.fetchedAt.__ts === true, r.web);
  ok('record: nothing typed and no web values = refused; web values alone are enough; a bad value is refused with its message',
    !WS.buildRecord({ at: new Date(T0), manual: {}, web: null }, user, FB).ok && WS.buildRecord({ at: new Date(T0), manual: {}, web }, user, FB).ok && WS.buildRecord({ at: new Date(T0), manual: { tempC: '999' }, web: null }, user, FB).errors.tempC, null);
  ok('record: an invalid date is refused', WS.buildRecord({ at: 'not a date', manual: { tempC: 1 }, web: null }, user, FB).errors.recordedAt, null);

  // ---- what a record says ----
  const rec = { manual: { tempC: -3, newSnowCm: 0 }, web: r.web };
  const eff = WS.effectiveValues(rec);
  ok('effective values: the typed value wins (even 0), otherwise the web value', eff.tempC.value === -3 && eff.tempC.source === 'manual' && eff.newSnowCm.value === 0 && eff.humidityPct.value === 86 && eff.humidityPct.source === 'lac' && eff.pressureKpa.value === 102, eff);
  const pub = WS.effectiveValues(rec, { publicOnly: true });
  ok('public values: typed and lake values only; airport values (pressure, clouds, visibility) are left out', pub.tempC.source === 'manual' && pub.humidityPct.source === 'lac' && pub.pressureKpa === undefined && pub.cloudCover === undefined && pub.visibilityKm === undefined, pub);
  ok('a typed value can be undone: with null the web value comes back', WS.effectiveValues({ manual: { tempC: null }, web: r.web }).tempC.value === 8.4, null);

  // ---- Firestore (fake) ----
  const writes = [], queries = [];
  const rows = [
    { id: 'r1', locationId: 'mountain', recordedAt: FB.firestore.Timestamp.fromDate(new Date(T0)), manual: {} },
    { id: 'r2', locationId: 'elsewhere', recordedAt: FB.firestore.Timestamp.fromDate(new Date(T0)), manual: {} },
    { id: 'r3', recordedAt: FB.firestore.Timestamp.fromDate(new Date(T0 + 3600000)), manual: {} },
    { id: 'r4', locationId: 'mountain', recordedAt: FB.firestore.Timestamp.fromDate(new Date(T0 + 3 * 86400000)), manual: {} }   // another day: left out
  ];
  const db = { collection: name => {
    const q = { clauses: [], where(f, op, v) { this.clauses.push([f, op, v]); return this; }, orderBy(f, d) { this.clauses.push(['orderBy', f, d]); return this; },
      async get() { queries.push({ name, clauses: this.clauses }); return { docs: rows.map(x => ({ id: x.id, data: () => { const { id, ...d } = x; return d; } })) }; },
      async add(d) { writes.push([name, 'add', d]); return { id: 'new1' }; },
      doc(id) { return { update: async d => { writes.push([name, id, 'update', d]); } }; } };
    return q;
  } };
  const saved = await WS.save(db, FB, { at: new Date(T0), manual: { tempC: 5 }, web: null }, user);
  ok('save: one document in weather_records with the author', saved.ok && saved.id === 'new1' && writes[0][0] === 'weather_records' && writes[0][2].createdBy === 'u1' && writes[0][2].manual.tempC === 5, writes[0]);
  const refused = await WS.save(db, FB, { at: new Date(T0), manual: {}, web: null }, user);
  ok('save: a refused record writes nothing', !refused.ok && writes.length === 1, refused);
  const upd = await WS.update(db, FB, 'r1', { manual: { tempC: 1 }, web: null }, { manual: { tempC: '2.5', newSnowCm: '3' }, comment: ' ok ', at: new Date(T0 + 60000) }, { uid: 'u2', name: 'Luc' });
  const patch = writes[1][3];
  ok('update: typed values, comment and time corrected; the editor and time recorded; the author is NOT in the change', upd.ok && patch.manual.tempC === 2.5 && patch.comment === 'ok' && patch.recordedAt.toMillis() === T0 + 60000 && patch.modifiedBy === 'u2' && patch.modifiedAt === 'SERVER_TS' && !('createdBy' in patch) && !('web' in patch), patch);
  const noValue = await WS.update(db, FB, 'r1', { manual: { tempC: 1 }, web: null }, { manual: { tempC: '' } }, user);
  ok('update: erasing the last value of a record without web values is refused', !noValue.ok && noValue.errors.values && writes.length === 2, noValue);
  const keepWeb = await WS.update(db, FB, 'r1', { manual: { tempC: 1 }, web: r.web }, { manual: { tempC: '' } }, user);
  ok('update: a record with web values may have its typed values erased (the web values show again)', keepWeb.ok, keepWeb);
  const day = await WS.listDay(db, FB, new Date(T0));
  const q = queries[queries.length - 1].clauses;
  ok('list: one query on the day only (recordedAt from midnight to the next midnight, oldest first; no composite index), other places filtered out',
    q[0][0] === 'recordedAt' && q[0][1] === '>=' && q[1][1] === '<' && q[1][2].toMillis() - q[0][2].toMillis() === 86400000 && q[2][0] === 'orderBy' && J(day.map(d => d.id)) === J(['r1', 'r3']), [q, day.map(d => d.id)]);

  // ---- for the statistics: one value per day (closest to noon), missing days, delete ----
  const stampAt = (d, h, m) => FB.firestore.Timestamp.fromDate(new Date(2026, 0, d, h, m || 0));
  const mk = (d, h, m, manual, web) => ({ recordedAt: stampAt(d, h, m), manual: manual || {}, web: web || null });
  const webT = v => ({ fields: { tempC: { value: v, source: 'lac', publishable: true } } });
  const day15 = [mk(15, 8, 0, { tempC: -20 }), mk(15, 11, 30, { tempC: -12 }), mk(15, 16, 0, { tempC: -9 })];
  const dv = WS.dailyValues(day15, 'tempC');
  ok('one value per day: among the day\'s readings the one closest to noon (11:30 beats 08:00 and 16:00)', dv.length === 1 && dv[0].day === '2026-01-15' && dv[0].value === -12, dv);
  ok('closest to noon counts both sides of noon: 12:20 beats 11:30 only when nearer', WS.dailyValues([mk(15, 11, 30, { tempC: 1 }), mk(15, 12, 20, { tempC: 2 })], 'tempC')[0].value === 2 && WS.dailyValues([mk(15, 11, 50, { tempC: 1 }), mk(15, 12, 20, { tempC: 2 })], 'tempC')[0].value === 1, null);
  const mixed = WS.dailyValues([mk(16, 9, 0, { newSnowCm: 5 }), mk(16, 12, 0, { tempC: -3 }), mk(14, 10, 0, { tempC: -5 }), mk(14, 12, 0, {}, webT(-4))], 'tempC');
  ok('per measure: a reading without that measure is skipped (the noon one has no snow, so the 09:00 snow counts); days oldest first; a web value counts when nothing was typed',
    J(WS.dailyValues([mk(16, 9, 0, { newSnowCm: 5 }), mk(16, 12, 0, { tempC: -3 })], 'newSnowCm').map(x => [x.day, x.value])) === J([['2026-01-16', 5]]) && J(mixed.map(x => [x.day, x.value, x.source])) === J([['2026-01-14', -4, 'lac'], ['2026-01-16', -3, 'manual']]), mixed);
  ok('a value of 0 is a value (no snow that day)', WS.dailyValues([mk(15, 12, 0, { newSnowCm: 0 })], 'newSnowCm')[0].value === 0, null);
  ok('nothing for the measure = no point', WS.dailyValues([mk(15, 12, 0, { tempC: 1 })], 'snowDepthCm').length === 0 && WS.dailyValues([], 'tempC').length === 0, null);
  const lastDay = new Date(2026, 0, 20);
  const missing = WS.missingDays([mk(20, 8), mk(18, 9), mk(10, 9), mk(1, 9)], lastDay, 20);   // 20 days: 1 Jan .. 20 Jan, the last day included
  ok('missing days: the 20 days ending on the given day, those without any reading, oldest first', missing.length === 16 && missing[0] === '2026-01-02' && !missing.includes('2026-01-20') && !missing.includes('2026-01-18') && !missing.includes('2026-01-10') && !missing.includes('2026-01-01') && missing.includes('2026-01-19'), missing);
  ok('missing days: all of them when there is no reading; none when every day has one', WS.missingDays([], lastDay, 20).length === 20 && WS.missingDays(Array.from({ length: 20 }, (_, i) => mk(1 + i, 9)), lastDay, 20).length === 0, null);
  const deleted = []; await WS.remove({ collection: n => ({ doc: id => ({ delete: async () => { deleted.push([n, id]); } }) }) }, 'abc');
  ok('delete: removes that reading from weather_records', J(deleted) === J([['weather_records', 'abc']]), deleted);
  // ---- the public copy of the latest reading ----
  const FBP = { firestore: { Timestamp: FB.firestore.Timestamp, FieldValue: { serverTimestamp: () => 'SERVER_TS' } } };
  const lakeAt = ms0 => ({ value: 0, source: 'lac', observedAt: ms0, publishable: true });
  const full = {
    id: 'P1', locationId: 'mountain', recordedAt: stampAt(15, 12), createdBy: 'u1', createdByName: 'Marie', comment: 'Belle neige',
    manual: { tempC: -14, newSnowCm: 12, snowDepthCm: 55, cloudCover: 'partly' },
    web: { fetchedAt: stampAt(15, 12, 5), fields: {
      tempC: Object.assign(lakeAt(0), { value: -11.5 }), windKmh: Object.assign(lakeAt(0), { value: 20 }), windDir: Object.assign(lakeAt(0), { value: 297 }),
      feelsLikeC: { value: -19, source: 'calc', observedAt: 0, publishable: true },
      pressureKpa: { value: 101.2, source: 'sherbrooke', observedAt: 0, publishable: false },
      visibilityKm: { value: 16, source: 'sherbrooke', observedAt: 0, publishable: false } } }
  };
  const pubDoc = WS.publicDocument(full, FBP);
  ok('public document: typed values first, then the lake station\'s; the airport\'s (pressure, visibility) are NOT there', pubDoc.measures.tempC === -14 && pubDoc.measures.newSnowCm === 12 && pubDoc.measures.windKmh === 20 && pubDoc.measures.feelsLikeC === -19 && !('pressureKpa' in pubDoc.measures) && !('visibilityKm' in pubDoc.measures), pubDoc.measures);
  ok('public document: no name, no comment, no author; the time of the reading and the place; the keys the rules allow', J(Object.keys(pubDoc).sort()) === J(['attribution', 'locationId', 'locationName', 'measures', 'recordedAt', 'updatedAt', 'webFields']) && pubDoc.locationName === 'Mont Orford' && pubDoc.recordedAt === full.recordedAt && pubDoc.updatedAt === 'SERVER_TS' && !/Marie|Belle neige|createdBy/.test(J(pubDoc)), Object.keys(pubDoc));
  ok('public document: webFields lists what came from the web (not the typed values), with a credit naming the lake station only', J(pubDoc.webFields.sort()) === J(['feelsLikeC', 'windDir', 'windKmh']) && /Environnement et Changement climatique Canada \(Lac Memphrémagog\)/.test(pubDoc.attribution) && !/Sherbrooke/.test(pubDoc.attribution), [pubDoc.webFields, pubDoc.attribution]);
  const typedOnly = WS.publicDocument({ locationId: 'mountain', recordedAt: stampAt(15, 9), manual: { tempC: 1 }, web: null }, FBP);
  ok('public document: typed values only = no web fields and no credit', J(typedOnly.webFields) === '[]' && typedOnly.attribution === null, typedOnly);
  ok('public document: a reading with only airport values has nothing publishable = null', WS.publicDocument({ locationId: 'mountain', recordedAt: stampAt(15, 9), manual: {}, web: { fields: { pressureKpa: full.web.fields.pressureKpa } } }, FBP) === null, null);
  ok('public document: every measure it can hold is a known field (the rules refuse anything else)', Object.keys(pubDoc.measures).every(k => WS.KEYS.includes(k)), null);

  // publishLatest with a fake Firestore: the 20 most recent readings, unsorted
  const store = { records: [], writes: [] };
  const dbp = { collection: name => name === 'weather_records'
    ? { orderBy() { return this; }, limit() { return this; }, async get() { return { docs: store.records.map(r => ({ id: r.id, data: () => { const { id, ...d } = r; return d; } })) }; } }
    : { doc: id => ({ set: async d => { store.writes.push([name, id, 'set', d]); }, delete: async () => { store.writes.push([name, id, 'delete']); } }) } };
  store.records = [
    { id: 'old', locationId: 'mountain', recordedAt: stampAt(10, 12), manual: { tempC: 3 } },
    { id: 'airportOnly', locationId: 'mountain', recordedAt: stampAt(16, 12), manual: {}, web: { fields: { pressureKpa: full.web.fields.pressureKpa } } },
    { id: 'newest', locationId: 'mountain', recordedAt: stampAt(15, 12), manual: { tempC: -14 } }
  ];
  const published = await WS.publishLatest(dbp, FBP);
  ok('publishLatest: the most recent reading that has something publishable (the 16th has only airport values, so the 15th), written to weather_public/latest',
    published.measures.tempC === -14 && store.writes.length === 1 && store.writes[0][0] === 'weather_public' && store.writes[0][1] === 'latest' && store.writes[0][2] === 'set', store.writes);
  store.records = []; store.writes.length = 0;
  const none2 = await WS.publishLatest(dbp, FBP);
  ok('publishLatest: no reading left (or none publishable) = the public document is removed', none2 === null && J(store.writes) === J([['weather_public', 'latest', 'delete']]), store.writes);

  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
</body></html>
