<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;color:#000;font-size:11px;z-index:99999">running...</pre>
<script>
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const AS = Q.get('as') || 'admin';
  const $ = id => document.getElementById(id);
  const type = (input, value) => { input.value = value; input.dispatchEvent(new Event('input', { bubbles: true })); };
  const choose = (select, value) => { select.value = value; select.dispatchEvent(new Event('change', { bubbles: true })); };
  const rows = () => [...document.querySelectorAll('#cal-points .cal-row')];
  const field = (row, name) => row.querySelector(`[data-field="${name}"]`);
  const clickMap = (x, y) => { const r = $('cal-map').getBoundingClientRect(); $('cal-map').dispatchEvent(new MouseEvent('click', { clientX: r.left + x, clientY: r.top + y, bubbles: true })); };
  window.confirm = () => true; // 'abandon the unsaved changes?' is answered yes (the real dialog would block the test)
  await wait(900);
  ok('no script errors on load', window.__errs.length === 0, window.__errs);

  const sys = AS === 'system';
  ok('Cartes tab is shown to a system admin only', ($('maps-tab-btn').style.display === 'none') === !sys, $('maps-tab-btn').style.display);
  if (!sys) { $('out').textContent = out.join('\n'); return; }

  switchTab('maps');
  await wait(700);
  ok('map list: ski (touring), ski-downhill, bike', J([...$('cal-network').options].map(o => o.value)) === J(['ski', 'ski-downhill', 'bike']) && /Descente/.test($('cal-network').options[1].textContent), [...$('cal-network').options].map(o => o.textContent));

  // ---- Ski: nothing in the database yet -> empty; then a saved calibration shows up as 3 points ----
  ok('ski: first activity, method 3 points (affine)', $('cal-network').value === 'ski' && $('cal-mode').value === 'affine');
  ok('ski: nothing saved -> "Aucune calibration", 3 empty rows, save disabled (no code default any more)', /Aucune calibration/.test($('cal-source').textContent) && rows().length === 3 && field(rows()[0], 'lat').value === '' && $('cal-save').disabled === true, $('cal-source').textContent);
  window.__data.maps = [{ id: 'ski', mode: 'affine', width: 800, height: 700, points: [
    { x: 0, y: 0, lat: 45.296611, lon: -72.243361 }, { x: 800, y: 0, lat: 45.325861, lon: -72.249972 }, { x: 0, y: 700, lat: 45.299444, lon: -72.205667 }] }];
  $('cal-reload').click(); await wait(800);
  ok('ski: source says it is saved', /Calibration enregistrée \(3 points, carte plate\)/.test($('cal-source').textContent), $('cal-source').textContent);
  ok('ski: 3 point rows with the 3 image corners', rows().length === 3 && J(rows().map(r => [field(r, 'x').value, field(r, 'y').value])) === J([['0', '0'], ['800', '0'], ['0', '700']]), rows().map(r => [field(r, 'x').value, field(r, 'y').value]));
  ok('ski: saved GPS values are shown', field(rows()[0], 'lat').value === '45.296611' && field(rows()[0], 'lon').value === '-72.243361', [field(rows()[0], 'lat').value, field(rows()[0], 'lon').value]);
  ok('ski: calibration valid, save enabled', $('cal-status').classList.contains('ok') && !$('cal-save').disabled, $('cal-status').className);
  ok('ski: map image loaded at natural size, no size warning', $('cal-image').naturalWidth === 800 && $('cal-size-warning').hidden === true, [$('cal-image').naturalWidth, $('cal-size-warning').textContent]);
  ok('ski: 3 numbered points drawn on the map', document.querySelectorAll('#cal-overlay circle').length === 3);
  ok('ski: GPS grid drawn (lat/lon lines with labels)', document.querySelectorAll('#cal-overlay path').length >= 4 && document.querySelectorAll('#cal-overlay text').length > 8, [document.querySelectorAll('#cal-overlay path').length, document.querySelectorAll('#cal-overlay text').length]);
  $('cal-grid').checked = false; $('cal-grid').dispatchEvent(new Event('change'));
  ok('grid can be hidden', document.querySelectorAll('#cal-overlay path').length === 0);
  $('cal-grid').checked = true; $('cal-grid').dispatchEvent(new Event('change'));

  clickMap(400, 350);
  ok('click on the map reads the GPS position there', /Pixel \(400, 350\) → GPS 45\.\d+, -72\.\d+/.test($('cal-readout').textContent), $('cal-readout').textContent);
  type($('cal-test'), '45.310, -72.230'); $('cal-test-btn').click();
  ok('test position: shows the pixel and a green diamond', /→ pixel \(\d+, \d+\)/.test($('cal-readout').textContent) && !!document.querySelector('#cal-overlay path[fill="#16a34a"]'), $('cal-readout').textContent);
  type($('cal-test'), 'abc'); $('cal-test-btn').click();
  ok('test position: bad text is explained', /Entrez une position GPS/.test($('cal-readout').textContent));

  // Save the ski defaults (this is what creates maps/ski)
  window.__writes.length = 0;
  $('cal-save').click(); await wait(300);
  const wSki = window.__writes.find(w => w[0] === 'maps');
  ok('ski: save writes maps/ski (affine, 3 points, size 800x700, user)', !!wSki && wSki[1] === 'ski' && wSki[3].mode === 'affine' && wSki[3].points.length === 3 && wSki[3].width === 800 && wSki[3].height === 700 && wSki[3].updatedBy === 'u1', wSki);
  ok('ski: still saved after saving again', /Calibration enregistrée/.test($('cal-source').textContent), $('cal-source').textContent);

  // ---- Ski downhill map: its own calibration, nothing saved yet ----
  choose($('cal-network'), 'ski-downhill');
  await wait(900);
  ok('downhill map: own image (1670 px), no size warning, no calibration yet, save disabled', $('cal-image').naturalWidth === 1670 && $('cal-size-warning').hidden === true && /Aucune calibration/.test($('cal-source').textContent) && $('cal-save').disabled === true, [$('cal-image').naturalWidth, $('cal-source').textContent]);
  ok('downhill map: the overlay has the downhill map size', $('cal-overlay').getAttribute('width') === '1670' && $('cal-overlay').getAttribute('height') === '736');
  // ---- Bike: nothing yet ----
  choose($('cal-network'), 'bike');
  await wait(700);
  ok('bike: no calibration message, 3 empty rows, save disabled', /Aucune calibration/.test($('cal-source').textContent) && rows().length === 3 && field(rows()[0], 'lat').value === '' && $('cal-save').disabled === true, $('cal-source').textContent);
  ok('bike: incomplete points -> info, not error', $('cal-status').classList.contains('info'), $('cal-status').className);
  ok('bike: map is the bike map, no size warning', $('cal-image').naturalWidth === 1600 && $('cal-size-warning').hidden === true, [$('cal-image').naturalWidth, $('cal-size-warning').textContent]);

  // ---- Choose 4 points ----
  choose($('cal-mode'), 'perspective');
  ok('choosing 4 points shows 4 rows', rows().length === 4, rows().length);

  // a perspective-looking set of points (geo square-ish -> pixels), typed like an admin would
  const P = [{ x: 300, y: 850, lat: 45.296, lon: -72.245 }, { x: 1500, y: 800, lat: 45.297, lon: -72.205 }, { x: 1100, y: 250, lat: 45.326, lon: -72.212 }, { x: 500, y: 300, lat: 45.322, lon: -72.247 }];
  P.forEach((p, i) => { type(field(rows()[i], 'x'), p.x); type(field(rows()[i], 'y'), p.y); type(field(rows()[i], 'lat'), p.lat); type(field(rows()[i], 'lon'), p.lon); });
  ok('bike 4 points: valid calibration, save enabled', $('cal-status').classList.contains('ok') && !$('cal-save').disabled, [$('cal-status').className, $('cal-status').textContent]);
  ok('bike 4 points: 4 points drawn + grid', document.querySelectorAll('#cal-overlay circle').length === 4 && document.querySelectorAll('#cal-overlay path').length >= 4);
  clickMap(800, 500);
  ok('bike: click reads a GPS position between the points', (() => { const m = /GPS (45\.\d+), (-72\.\d+)/.exec($('cal-readout').textContent); return m && +m[1] > 45.295 && +m[1] < 45.33 && +m[2] < -72.20 && +m[2] > -72.25; })(), $('cal-readout').textContent);
  // the first control point maps back to its own pixel
  type($('cal-test'), P[0].lat + ', ' + P[0].lon); $('cal-test-btn').click();
  ok('bike: test with control point 1 lands on its pixel', new RegExp(`pixel \\(${P[0].x}, ${P[0].y}\\)`).test($('cal-readout').textContent), $('cal-readout').textContent);

  // pasted pair fills both fields
  const latInput = field(rows()[3], 'lat');
  type(latInput, '45.3225, -72.2465');
  ok('a pasted "lat, lon" pair fills latitude and longitude', latInput.value === '45.3225' && field(rows()[3], 'lon').value === '-72.2465', [latInput.value, field(rows()[3], 'lon').value]);

  // place a point by clicking on the map
  rows()[0].querySelector('.cal-row__place').click();
  ok('placing mode: hint, crosshair and highlighted row', /Cliquez sur la carte à l'endroit du point 1/.test($('cal-hint').textContent) && $('cal-map').classList.contains('is-placing') && rows()[0].classList.contains('is-placing'));
  clickMap(310, 860);
  ok('click sets x, y of the point and ends placing mode', field(rows()[0], 'x').value === '310' && field(rows()[0], 'y').value === '860' && !$('cal-map').classList.contains('is-placing'), [field(rows()[0], 'x').value, field(rows()[0], 'y').value]);

  // an unusable set is refused
  const keep = P.map((p, i) => [field(rows()[i], 'lat').value, field(rows()[i], 'lon').value]);
  [0, 1, 2, 3].forEach(i => { type(field(rows()[i], 'lat'), 45.30 + i * 0.01); type(field(rows()[i], 'lon'), -72.24 + i * 0.01); });
  ok('4 aligned GPS points -> error message and save disabled', $('cal-status').classList.contains('error') && $('cal-save').disabled, $('cal-status').textContent);
  [0, 1, 2, 3].forEach(i => { type(field(rows()[i], 'lat'), keep[i][0]); type(field(rows()[i], 'lon'), keep[i][1]); });
  ok('back to valid points -> ok again', $('cal-status').classList.contains('ok') && !$('cal-save').disabled, $('cal-status').textContent);

  // save
  window.__writes.length = 0;
  $('cal-save').click(); await wait(300);
  const wBike = window.__writes.find(w => w[0] === 'maps');
  ok('bike: save writes maps/bike (perspective, 4 points, size 1600x919)', !!wBike && wBike[1] === 'bike' && wBike[3].mode === 'perspective' && wBike[3].points.length === 4 && wBike[3].width === 1600 && wBike[3].height === 919, wBike);
  ok('bike: the app can now place GPS positions on the bike map', MapService.canLocate('bike') === true && MapService.definition('bike').mode === 'perspective');

  // back to 3 points: only 3 rows and 3 saved
  choose($('cal-mode'), 'affine');
  ok('switching to 3 points shows 3 rows and keeps the first 3 points', rows().length === 3 && field(rows()[1], 'x').value === '1500');
  choose($('cal-network'), 'ski'); // dirty -> confirm() is asked; auto-accept
  await wait(200);
  ok('no script errors at the end', window.__errs.length === 0, window.__errs);

  $('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
