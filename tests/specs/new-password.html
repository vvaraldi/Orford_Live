<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;color:#000;font-size:11px;z-index:99999">running...</pre>
<script>
// The page the password-reset e-mail leads to. The mock plays Firebase: ?code= = how the e-mail link's code checks out
// (ok | expired | invalid | offline), ?confirm= = how saving the new password goes (weak | used). Every auth call is in window.__authCalls.
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);
  const shown = id => $(id).style.display !== 'none';
  const visible = () => ['verifying', 'form', 'error', 'success'].filter(s => shown(s + '-state')).join('+');
  const type = (id, v) => { $(id).value = v; $(id).dispatchEvent(new Event('input')); };
  const submit = () => $('reset-password-form').dispatchEvent(new Event('submit', { cancelable: true }));
  const calls = () => window.__authCalls;
  const code = Q.get('code'), confirmMode = Q.get('confirm'), mode = Q.get('mode'), oob = Q.get('oobCode');
  await wait(400);
  ok('no script errors on load', window.__errs.length === 0, window.__errs);

  if (!oob) {
    ok('no code in the link: "Paramètres manquants", the code is never checked', visible() === 'error' && /Paramètres manquants/.test($('error-description').textContent) && calls().length === 0, [visible(), $('error-description').textContent, calls()]);
    ok('...with a way to ask for a new link', $('new-link-btn').getAttribute('href') === 'forgot-password.html' && !shown('form-state'), null);
  } else if (mode !== 'resetPassword') {
    ok('another kind of e-mail link (not a password reset): refused with a clear message, the code is not used', visible() === 'error' && /pas un lien de réinitialisation/.test($('error-description').textContent) && calls().length === 0, [visible(), $('error-description').textContent, calls()]);
  } else if (code === 'expired') {
    ok('expired link: only the error is shown, with the 1 hour rule', visible() === 'error' && /a expiré.*1 heure/.test($('error-description').textContent), [visible(), $('error-description').textContent]);
    ok('...with "Demander un nouveau lien" (no retry button: retrying cannot help)', $('new-link-btn').getAttribute('href') === 'forgot-password.html' && $('retry-btn').style.display === 'none', null);
  } else if (code === 'invalid') {
    ok('link already used or invalid: clear message and a new-link button', visible() === 'error' && /invalide ou a déjà été utilisé/.test($('error-description').textContent) && $('new-link-btn').getAttribute('href') === 'forgot-password.html', $('error-description').textContent);
  } else if (code === 'offline') {
    ok('no connection while checking the link: says so and offers "Réessayer"', visible() === 'error' && /Connexion impossible/.test($('error-description').textContent) && $('retry-btn').style.display === 'block', [visible(), $('error-description').textContent]);
    $('retry-btn').click(); await wait(200);
    ok('"Réessayer" checks the code again', calls().filter(c => c[0] === 'verify').length === 2, calls());
  } else {
    // a valid link
    ok('valid link: the code from the URL is checked, then only the form is shown', J(calls()[0]) === J(['verify', oob]) && visible() === 'form', [calls(), visible()]);
    ok('...for the account the link belongs to', /marie@example\.test/.test($('user-email-display').textContent), $('user-email-display').textContent);

    // strength hint
    type('new-password', 'abc');
    ok('strength hint: short simple password is "Faible"', $('password-strength').textContent === 'Faible' && /strength-weak/.test($('password-strength').className), $('password-strength').textContent);
    type('new-password', 'Abcdef12!xyz');
    ok('strength hint: long mixed password is "Fort"', $('password-strength').textContent === 'Fort' && /strength-strong/.test($('password-strength').className), $('password-strength').textContent);

    // show / hide
    const tg = document.querySelector('[data-toggle-for="new-password"]');
    tg.click();
    ok('the eye button shows the password, then hides it again', $('new-password').type === 'text' && ($('confirm-password').type === 'password') && (tg.click(), $('new-password').type === 'password'), null);

    // validation, nothing is sent
    type('new-password', 'abc'); type('confirm-password', 'abc'); submit(); await wait(50);
    ok('too short (< 6): refused on the page, nothing sent', /au moins 6 caractères/.test($('auth-message').textContent) && shown('auth-message') && calls().filter(c => c[0] === 'confirm').length === 0, [$('auth-message').textContent, calls()]);
    type('new-password', 'Secret123'); type('confirm-password', 'Secret124'); submit(); await wait(50);
    ok('different confirmation: refused, nothing sent', /ne correspondent pas/.test($('auth-message').textContent) && calls().filter(c => c[0] === 'confirm').length === 0, [$('auth-message').textContent, calls()]);
    type('confirm-password', 'Secret1');
    ok('typing again clears the message', !shown('auth-message'), null);

    // the real submit
    type('new-password', 'Secret123'); type('confirm-password', 'Secret123');
    submit(); submit(); await wait(300);                    // a double click must send once
    const confirms = calls().filter(c => c[0] === 'confirm');
    ok('submit: the code and the new password go to Firebase, once even on a double click', confirms.length === 1 && J(confirms[0]) === J(['confirm', oob, 'Secret123']), confirms);
    if (confirmMode === 'weak') {
      ok('Firebase refuses a weak password: clear message, the form stays and is usable again', visible() === 'form' && /trop faible/.test($('auth-message').textContent) && !$('submit-btn').disabled && !$('new-password').disabled && $('submit-btn').textContent === 'Réinitialiser le mot de passe', [visible(), $('auth-message').textContent]);
    } else if (confirmMode === 'used') {
      ok('the link was used meanwhile: clear message on the form', visible() === 'form' && /déjà été utilisé/.test($('auth-message').textContent), [visible(), $('auth-message').textContent]);
    } else {
      ok('success: the confirmation with a button to the login page', visible() === 'success' && $('login-btn').getAttribute('href') === 'login.html', [visible(), $('login-btn').getAttribute('href')]);
      // nothing from the old page is left, and the page uses the shared loader/config like the other sign-in pages
      const src = await (await fetch('/pages/new-password.html')).text();
      ok('page: no dependency on the old version-config / mobile-menu / AppVersion, no second Firebase config', !/version-config|mobile-menu|AppVersion|firebase\.initializeApp|firebaseConfig/.test(src), null);
      ok('page: loads the shared config, loader and auth scripts and the main stylesheet', ['js/core/config.js', 'js/core/firebase-loader.js', 'js/core/auth.js', 'css/main.css'].every(s => src.includes(s)), null);
      // the stopgap for the OLD address (tools/old-site-redirect): forwards the link's query string to this page on the live site (case: /Regis/)
      const red = await (await fetch('/tools/old-site-redirect/reset-password.html')).text();
      ok('old-address redirect: sends the whole link (query string + hash) to /Regis/pages/new-password.html on the live site', /https:\/\/regis-orford\.github\.io\/Regis\/pages\/new-password\.html'\s*\+\s*window\.location\.search\s*\+\s*window\.location\.hash/.test(red), null);
      ok('old-address redirect: its target page is the one tested here (it exists in the project)', (await fetch('/pages/new-password.html')).ok && !/reset-password\.html'\s*\+\s*window/.test(red), null);
    }
  }
  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
