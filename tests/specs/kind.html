<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Kind tests</title></head>
<body>
<pre id="out">running...</pre>
<script src="/js/core/config.js"></script>
<script src="/js/core/network.js"></script>
<script src="/js/core/kind.js"></script>
<script>
(() => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  let reloads = 0;
  Network.reload = () => { reloads++; };
  const asSystemAdmin = () => Network.setUser({ role: 'system_admin', networks: ['ski', 'bike'] });
  const clear = () => { try { localStorage.removeItem('orford-kind'); localStorage.removeItem('orford-network'); } catch (e) {} };

  // ---- default: no persisted choice ----
  // Network.current() picks by season otherwise; force ski regardless of today's actual date.
  clear();
  localStorage.setItem('orford-network', J({ id: 'ski', season: Network.ofSeason() }));
  asSystemAdmin();
  ok('ski, no persisted choice: defaults to the first inspectionKind (uphill)', Network.current() === 'ski' && Kind.current() === 'uphill', Kind.current());
  ok('ids() returns the activity\'s inspectionKinds', J(Kind.ids()) === J(['uphill', 'downhill']), Kind.ids());

  // ---- a persisted choice for the SAME network is honoured ----
  clear();
  localStorage.setItem('orford-network', J({ id: 'ski', season: Network.ofSeason() }));
  localStorage.setItem('orford-kind', J({ network: 'ski', kind: 'downhill' }));
  asSystemAdmin();
  ok('a persisted choice for the current network is honoured', Network.current() === 'ski' && Kind.current() === 'downhill', Kind.current());

  // ---- a persisted choice for a DIFFERENT network is ignored ----
  clear();
  localStorage.setItem('orford-network', J({ id: 'ski', season: Network.ofSeason() }));
  localStorage.setItem('orford-kind', J({ network: 'bike', kind: 'downhill' })); // wrong network (also not a bike kind)
  asSystemAdmin();
  ok('a persisted choice saved for another network is ignored (falls back to default)', Network.current() === 'ski' && Kind.current() === 'uphill', Kind.current());

  // ---- an invalid/unknown kind is ignored ----
  clear();
  localStorage.setItem('orford-network', J({ id: 'ski', season: Network.ofSeason() }));
  localStorage.setItem('orford-kind', J({ network: 'ski', kind: 'sideways' }));
  asSystemAdmin();
  ok('an unknown kind value is ignored (falls back to default)', Network.current() === 'ski' && Kind.current() === 'uphill', Kind.current());

  // ---- bike: a single kind, always itself, never a switcher's worth of ids ----
  clear();
  localStorage.setItem('orford-network', J({ id: 'bike', season: Network.ofSeason() }));
  asSystemAdmin();
  ok('bike: one kind only, current() is simply that one', Network.current() === 'bike' && Kind.current() === 'bike' && J(Kind.ids()) === J(['bike']), [Kind.current(), Kind.ids()]);

  // ---- set(): validation and the reload hook ----
  clear();
  localStorage.setItem('orford-network', J({ id: 'ski', season: Network.ofSeason() }));
  asSystemAdmin();
  reloads = 0;
  Kind.set('not-a-kind');
  ok('set(): an invalid kind is a no-op (no write, no reload)', reloads === 0 && localStorage.getItem('orford-kind') === null, [reloads, localStorage.getItem('orford-kind')]);
  Kind.set(Kind.current());
  ok('set(): the same kind already shown is a no-op', reloads === 0 && localStorage.getItem('orford-kind') === null, reloads);
  Kind.set('downhill');
  const saved = JSON.parse(localStorage.getItem('orford-kind') || 'null');
  ok('set(): a valid different kind is persisted (tied to the network) and reloads', reloads === 1 && saved && saved.network === 'ski' && saved.kind === 'downhill', [reloads, saved]);

  // ---- Network.seasonStart: one rule for every activity (statsSince: ski 1 Sept, bike 1 May) ----
  const startOf = (net, y, m, d) => {
    Network.now = () => new Date(y, m - 1, d);
    clear();
    localStorage.setItem('orford-network', J({ id: net, season: Network.ofSeason() }));
    asSystemAdmin();
    const s = Network.seasonStart();
    return [s.getFullYear(), s.getMonth() + 1, s.getDate()].join('-');
  };
  ok('seasonStart, ski, on 4 Oct 2026 (out of season): the winter that just ended started 1 Nov 2025', startOf('ski', 2026, 10, 4) === '2025-11-1', startOf('ski', 2026, 10, 4));
  ok('seasonStart, ski, on 10 Feb 2026 (in season): 1 Nov 2025', startOf('ski', 2026, 2, 10) === '2025-11-1', startOf('ski', 2026, 2, 10));
  ok('seasonStart, ski, exactly on 1 Nov: that very day', startOf('ski', 2026, 11, 1) === '2026-11-1', startOf('ski', 2026, 11, 1));
  ok('seasonStart, ski, on 31 Oct: still the previous winter', startOf('ski', 2026, 10, 31) === '2025-11-1', startOf('ski', 2026, 10, 31));
  ok('seasonStart, bike, on 4 Oct 2026 (in season): 1 May 2026', startOf('bike', 2026, 10, 4) === '2026-5-1', startOf('bike', 2026, 10, 4));
  ok('seasonStart, bike, on 10 Feb 2026 (out of season): the summer that just ended started 1 May 2025', startOf('bike', 2026, 2, 10) === '2025-5-1', startOf('bike', 2026, 2, 10));
  const rangeOf = (net, y, m, d) => { startOf(net, y, m, d); const r = Network.seasonRange(); const f = x => [x.getFullYear(), x.getMonth() + 1, x.getDate()].join('-'); return [f(r.start), f(r.end), r.active].join(' '); };
  ok('seasonRange, ski in season: 1 Nov -> 30 Apr (runs over New Year), active', rangeOf('ski', 2026, 2, 10) === '2025-11-1 2026-4-30 true', rangeOf('ski', 2026, 2, 10));
  ok('seasonRange, ski out of season: the ended winter, not active', rangeOf('ski', 2026, 7, 15) === '2025-11-1 2026-4-30 false', rangeOf('ski', 2026, 7, 15));
  ok('seasonRange, ski, last day 30 Apr is still in season, 1 May is not', rangeOf('ski', 2026, 4, 30) === '2025-11-1 2026-4-30 true' && rangeOf('ski', 2026, 5, 1) === '2025-11-1 2026-4-30 false', [rangeOf('ski', 2026, 4, 30), rangeOf('ski', 2026, 5, 1)]);
  ok('seasonRange, bike in season: 1 May -> 31 Oct, active; on 31 Oct still active, 1 Nov not', rangeOf('bike', 2026, 7, 1) === '2026-5-1 2026-10-31 true' && rangeOf('bike', 2026, 10, 31) === '2026-5-1 2026-10-31 true' && rangeOf('bike', 2026, 11, 1) === '2026-5-1 2026-10-31 false', [rangeOf('bike', 2026, 7, 1), rangeOf('bike', 2026, 10, 31), rangeOf('bike', 2026, 11, 1)]);
  ok('seasonRange/seasonStart of another activity by id (the export uses it)', Network.seasonStart('bike').getMonth() === 4 && Network.seasonStart('ski').getMonth() === 10);
  // the two seasons share the year with no gap and no overlap: which activity opens by default
  const dflt = (y, m, d) => Network.ofSeason(new Date(y, m - 1, d));
  ok('ofSeason: ski from 1 Nov to 30 Apr, bike from 1 May to 31 Oct (no gap, no overlap)', ['2026-10-31:bike', '2026-11-1:ski', '2026-12-25:ski', '2027-1-1:ski', '2027-4-30:ski', '2027-5-1:bike', '2027-8-15:bike'].every(s => { const [d, n] = s.split(':'); const [y, m, dd] = d.split('-').map(Number); return dflt(y, m, dd) === n; }));
  ok('config: no old season fields left (statsSince, seasonMonths)', !JSON.stringify(APP_CONFIG.networks).match(/statsSince|seasonMonths/));
  const label = (net, y, m, d) => { startOf(net, y, m, d); return Network.seasonLabel(Network.seasonRange()); };
  ok('seasonLabel: running season says "en cours", an ended one says "Dernière saison" with both dates', /^Saison en cours \(depuis le /.test(label('ski', 2026, 2, 10)) && /^Dernière saison \(.* – /.test(label('ski', 2026, 7, 15)), [label('ski', 2026, 2, 10), label('ski', 2026, 7, 15)]);
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
