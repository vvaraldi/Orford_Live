<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;color:#000;font-size:11px;z-index:99999">running...</pre>
<script>
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const PAGE = Q.get('page');
  const opts = el => [...el.options].map(o => o.value);
  const bike = NET === 'bike' || (NET === 'both' && Q.get('choice') === 'bike');
  const downhill = Q.get('kind') === 'downhill';
  await wait(800);
  ok('current activity is ' + (bike ? 'bike' : 'ski'), Network.current() === (bike ? 'bike' : 'ski'), Network.current());
  ok('confirm() and alert() are the browser\'s own synchronous ones (ui.js must not replace them with Promise-returning dialogs)', /\[native code\]/.test(Function.prototype.toString.call(window.confirm)) && /\[native code\]/.test(Function.prototype.toString.call(window.alert)) && typeof confirmDialog === 'function');
  const SKI_SECTORS = ['', 'mont-orford', 'mont-giroux-nord'];

  if (PAGE === 'infraction-report') {
    ok('sectors of this activity only', J(opts(sectorSelect)) === J(bike ? ['', 'sentiers-velo'] : SKI_SECTORS), opts(sectorSelect));
    ok('fault types come from this activity\'s config', J(opts(faultSelect)) === J(bike ? ['', 'acces-non-accredite', 'deterioration', 'autres'] : ['', 'downhill', 'saut-dangereux', 'ski-hors-piste', 'ski-piste-fermee', 'saut-des-chaises', 'manoeuvre-dangereuse', 'autres']), opts(faultSelect));
    ok('practices come from this activity\'s config', J(opts(practiceSelect)) === J(bike ? ['', 'velo', 'autres'] : ['', 'ski', 'snowboard', 'raquette', 'autres']), opts(practiceSelect));
    const mine = opts(reportSelector).filter(v => v !== 'new');
    ok('past reports of this activity only (legacy = ski)', J(mine.sort()) === J(bike ? ['INFB'] : ['INF1', 'INF2', 'INF3', 'INF4']), mine);

    if (!bike) {
      // ---- the trails of a sector come from trail records (all kinds together), the picker shows names only ----
      sectorSelect.value = 'mont-orford'; populateTrails();
      ok('sector with trail records: uphill and downhill together, by name; hidden and sector-less trails are not offered', J(opts(trailSelect)) === J(['', 'trail_2', 'run_2', 'run_1']) && J([...trailSelect.options].slice(1).map(o => o.textContent)) === J(['Adams', 'Maxi', 'Slalom']), [opts(trailSelect), [...trailSelect.options].map(o => o.textContent)]);
      // ---- a sector with no trail record yet has no trails to offer (the old name-list fallback was removed) ----
      sectorSelect.value = 'mont-giroux-nord'; populateTrails();
      ok('sector without trail records: only the placeholder (no name-list fallback any more)', J(opts(trailSelect)) === J(['']), opts(trailSelect));
      // two names that look the same get their number to tell them apart (only then)
      const fake = { items: [{ id: 'a', name: 'Familiale', number: '11', kind: 'downhill' }, { id: 'b', name: 'familiale', number: undefined, kind: 'uphill' }, { id: 'c', name: 'Adams', number: '5', kind: 'downhill' }] };
      SectorService.fillTrails(trailSelect, fake, '--');
      ok('duplicate names in one sector show the number (or the kind) in brackets, other names stay plain', J([...trailSelect.options].slice(1).map(o => o.textContent)) === J(['Familiale (11)', 'familiale (uphill)', 'Adams']), [...trailSelect.options].map(o => o.textContent));

      // ---- OLD record (name only, old sector alias, trail no longer in any list): kept as an extra option ----
      reportSelector.value = 'INF1'; handleReportChange();
      ok('old record: alias selects the current sector, name kept as "(ancienne piste)" since no list has it any more', sectorSelect.value === 'mont-giroux-nord' && trailSelect.value === 'legacy:Magog', [sectorSelect.value, trailSelect.value]);
      await handleModify();
      let u = window.__writes.filter(x => x[0] === 'infractions' && x[2] === 'update');
      ok('modify saves the canonical sector, the name, trailId null, and never sends "network"', u.length === 1 && u[0][3].sector === 'mont-giroux-nord' && u[0][3].trail === 'Magog' && u[0][3].trailId === null && !('network' in u[0][3]), u);
      window.__writes.length = 0; resetForm();

      // ---- OLD record whose name matches a trail record (other spelling): selected by name, upgraded on save ----
      reportSelector.value = 'INF3'; handleReportChange();
      ok('old record "MAXI" (name only) finds the trail record "Maxi" by name', sectorSelect.value === 'mont-orford' && trailSelect.value === 'run_2', [sectorSelect.value, trailSelect.value]);
      await handleModify();
      u = window.__writes.filter(x => x[0] === 'infractions' && x[2] === 'update');
      ok('saving it stores the trail name and now the trailId (the record upgrades itself)', u.length === 1 && u[0][3].trail === 'Maxi' && u[0][3].trailId === 'run_2', u);
      window.__writes.length = 0; resetForm();

      // ---- OLD record whose trail no longer exists: kept as it was ----
      reportSelector.value = 'INF4'; handleReportChange();
      ok('old record with a trail that is gone: the old name is kept as an extra option', trailSelect.value === 'legacy:Ancien nom' && [...trailSelect.options].some(o => o.textContent === 'Ancien nom (ancienne piste)'), [trailSelect.value, opts(trailSelect)]);
      await handleModify();
      u = window.__writes.filter(x => x[0] === 'infractions' && x[2] === 'update');
      ok('saving it keeps the old name and adds no trailId', u.length === 1 && u[0][3].trail === 'Ancien nom' && u[0][3].trailId === null, u);
      window.__writes.length = 0; resetForm();

      // ---- NEW record (has a trailId): selected by id ----
      reportSelector.value = 'INF2'; handleReportChange();
      ok('new-format record: selected by its trailId', trailSelect.value === 'run_2', trailSelect.value);
      window.__writes.length = 0; resetForm();

      // ---- create a new report from a trail record ----
      sectorSelect.value = 'mont-orford'; populateTrails(); trailSelect.value = 'run_1';
      offenderName.value = 'New Person'; faultSelect.value = 'downhill';
      await handleSubmit({ preventDefault() {} });
      const w = window.__writes.filter(x => x[0] === 'infractions' && x[2] === 'add');
      ok('a new report is saved with network "ski", the trail NAME (as before) and the trailId', w.length === 1 && w[0][3].network === 'ski' && w[0][3].trail === 'Slalom' && w[0][3].trailId === 'run_1' && w[0][3].sector === 'mont-orford', w);
    } else {
      sectorSelect.value = 'sentiers-velo'; populateTrails();
      ok('bike sector: trail records of the bike activity', J(opts(trailSelect)) === J(['', 'bike_2', 'bike_1']), opts(trailSelect));
      trailSelect.value = 'bike_1';
      offenderName.value = 'New Biker'; faultSelect.value = 'autres';
      await handleSubmit({ preventDefault() {} });
      const w = window.__writes.filter(x => x[0] === 'infractions' && x[2] === 'add');
      ok('a new report is saved with network "bike", the name and the trailId', w.length === 1 && w[0][3].network === 'bike' && w[0][3].sector === 'sentiers-velo' && w[0][3].trail === 'Piste verte' && w[0][3].trailId === 'bike_1', w);
    }
  }

  if (PAGE === 'signalisation-report') {
    ok('sectors: only those with trails of the view shown (Montée / Descente)', J(opts(sectorSelect)) === J(bike ? ['', 'sentiers-velo'] : ['', 'mont-orford']), opts(sectorSelect));
    const mine = opts(reportSelector).filter(v => v !== 'new');
    ok('past reports of this activity and view (an old report whose trail is unknown shows in both)', J(mine.sort()) === J(bike ? ['SIGB'] : (downhill ? ['SIG1', 'SIG2'] : ['SIG1'])), mine);
    if (!bike) {
      sectorSelect.value = 'mont-orford'; populateTrails();
      ok(downhill ? 'Descente: the sector offers its downhill runs (and lifts), not the uphill trail' : 'Montée: the sector offers its uphill trail only', J(opts(trailSelect)) === J(downhill ? ['', 'run_2', 'run_1'] : ['', 'trail_2']), opts(trailSelect));
      reportSelector.value = 'SIG1'; handleReportChange();
      ok('old report: alias selects the current sector (kept selectable although it has no trail in this view), name kept as "(ancienne piste)" since no list has it any more', sectorSelect.value === 'mont-giroux-nord' && trailSelect.value === 'legacy:Magog', [sectorSelect.value, trailSelect.value]);
      await handleModify();
      let u = window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'update');
      ok('modify saves the canonical sector, the name, trailId null, and never sends "network"', u.length === 1 && u[0][3].sector === 'mont-giroux-nord' && u[0][3].trail === 'Magog' && u[0][3].trailId === null && !('network' in u[0][3]), u);
      window.__writes.length = 0; resetForm();
      if (downhill) {
        reportSelector.value = 'SIG2'; handleReportChange();
        ok('new-format report: selected by its trailId', sectorSelect.value === 'mont-orford' && trailSelect.value === 'run_2', [sectorSelect.value, trailSelect.value]);
        window.__writes.length = 0; resetForm();
      }
    }
    const newTrail = bike ? 'bike_1' : (downhill ? 'run_2' : 'trail_2');
    sectorSelect.value = bike ? 'sentiers-velo' : 'mont-orford';
    populateTrails(); trailSelect.value = newTrail; statusSelect.value = 'ouverte';
    await handleSubmit({ preventDefault() {} });
    const w = window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'add');
    const names = { bike_1: 'Piste verte', run_2: 'Maxi', trail_2: 'Adams' };
    ok('a new report is saved with the current network, the trail name and the trailId', w.length === 1 && w[0][3].network === (bike ? 'bike' : 'ski') && w[0][3].trail === names[newTrail] && w[0][3].trailId === newTrail, w);
  }

  if (PAGE === 'infraction-admin') {
    const ids = [...document.querySelectorAll('#infractions-tbody tr[data-id]')].map(r => r.dataset.id).sort();
    const headCells = [...document.querySelectorAll('table thead th')].map(th => th.textContent.trim());
    const photoCell = id => { const row = document.querySelector(`#infractions-tbody tr[data-id=${id}]`); return row && row.children[headCells.indexOf('Photos')].textContent.trim(); };
    ok('a "Photos" column (like Signalisations) between the location and the patrol officer', J(headCells.slice(3, 6)) === J(['Localisation', 'Photos', 'Patrouilleur']), headCells);
    ok('the column shows the number of photos of each infraction', bike ? photoCell('INFB') === '📷 0' : (photoCell('INF2') === '📷 1' && photoCell('INF1') === '📷 0'), [photoCell('INF1'), photoCell('INF2'), photoCell('INFB')]);
    ok('lists this activity\'s infractions only (old and new format together)', J(ids) === J(bike ? ['INFB'] : ['INF1', 'INF2', 'INF3', 'INF4']), ids);
    if (bike) {
      ok('bike labels: fault shown from the bike config', document.querySelector('#infractions-tbody tr[data-id=INFB]').textContent.includes('Autre (voir commentaires)'), document.querySelector('#infractions-tbody tr[data-id=INFB]').textContent);
    } else {
      ok('ski fault label shown', [...document.querySelectorAll('#infractions-tbody tr')].some(r => r.textContent.includes('Saut dangereux')));
      const text = id => document.querySelector(`#infractions-tbody tr[data-id=${id}]`).textContent;
      ok('old and new records show the same way (the stored trail name)', text('INF2').includes('Maxi') && text('INF3').includes('MAXI') && text('INF4').includes('Ancien nom'), [text('INF2'), text('INF3'), text('INF4')]);
    }
  }

  if (PAGE === 'signalisation-admin') {
    const ids = [...document.querySelectorAll('#reports-tbody tr[data-id]')].map(r => r.dataset.id).sort();
    ok('lists this activity\'s reports of the view shown (an old report whose trail is unknown shows in both)', J(ids) === J(bike ? ['SIGB'] : (downhill ? ['SIG1', 'SIG2'] : ['SIG1'])), ids);
    ok('sector filter offers the sectors that have trails in the view shown', J(opts(document.getElementById('filter-sector'))) === J(bike ? ['', 'sentiers-velo'] : ['', 'mont-orford']), opts(document.getElementById('filter-sector')));
    // ---- an admin can correct a report's sector and trail (and so move it between Montée and Descente) ----
    if (!bike) {
      const toasts = []; showToast = (m, type) => toasts.push([m, type]);
      const updates = () => window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'update');
      window.__writes.length = 0;
      // unchanged location: resolving / commenting never rewrites sector or trail (old report, alias sector, name only)
      openDetail('SIG1');
      ok('modal: the location is editable and starts on the report\'s own sector and trail', document.getElementById('admin-sector').value === 'mont-giroux-nord' && document.getElementById('admin-trail').value === 'legacy:Magog', [document.getElementById('admin-sector').value, document.getElementById('admin-trail').value]);
      document.getElementById('admin-comments').value = 'vu'; await saveChanges(); await wait(200);
      ok('saving without touching the location writes no sector/trail (nor network)', updates().length === 1 && !('sector' in updates()[0][3]) && !('trail' in updates()[0][3]) && !('trailId' in updates()[0][3]) && !('network' in updates()[0][3]) && updates()[0][3].adminComments === 'vu', updates());
      // a sector without a trail chosen is refused
      window.__writes.length = 0; openDetail('SIG1');
      document.getElementById('admin-sector').value = 'mont-orford'; document.getElementById('admin-sector').dispatchEvent(new Event('change'));
      ok('a new sector asks for its trail again (placeholder first)', document.getElementById('admin-trail').value === '', document.getElementById('admin-trail').value);
      await saveChanges();
      ok('sector changed but no trail chosen: refused, nothing written', updates().length === 0 && toasts.some(t => /Choisissez un secteur et une piste/.test(t[0])), [updates(), toasts]);
      // Descente <-> Montée: pick a trail of the other view
      closeModal(); window.__writes.length = 0; toasts.length = 0;
      openDetail(downhill ? 'SIG2' : 'SIG1');
      const sec = document.getElementById('admin-sector');
      sec.value = 'mont-orford'; sec.dispatchEvent(new Event('change'));
      const labels = [...document.getElementById('admin-trail').options].map(o => o.textContent);
      ok('the trail list shows every kind of the sector, each with its kind', J(labels) === J(['-- Sélectionner une piste --', 'Adams (Montée)', 'Maxi (Descente)', 'Slalom (Descente)']), labels);
      document.getElementById('admin-trail').value = downhill ? 'trail_2' : 'run_1';
      await saveChanges(); await wait(300);
      const upd = updates()[0] && updates()[0][3];
      const expected = downhill ? { trail: 'Adams', trailId: 'trail_2' } : { trail: 'Slalom', trailId: 'run_1' };
      ok('the new sector, its display name, the trail name and trailId are saved (never the network)', !!upd && upd.sector === 'mont-orford' && upd.sectorDisplayName === 'Mont-Orford' && upd.trail === expected.trail && upd.trailId === expected.trailId && !('network' in upd), updates());
      ok('the toast says which view the report moved to', toasts.some(t => new RegExp('vue « ' + (downhill ? 'Montée' : 'Descente') + ' »').test(t[0])), toasts);
    }
  }

  if (PAGE === 'signalisation-resume') {
    const ids = [...document.querySelectorAll('#reports-tbody tr[data-id]')].map(r => r.dataset.id).sort();
    ok('lists this activity\'s active reports of the view shown (an old report whose trail is unknown shows in both)', J(ids) === J(bike ? ['SIGB'] : (downhill ? ['SIG1', 'SIG2'] : ['SIG1'])), ids);
    const img = document.getElementById('map-image');
    const swBtns = () => [...document.querySelectorAll('#map-switch button')];
    if (bike) {
      ok('bike: one geolocalisation map, no switch', document.getElementById('map-switch').hidden === true && img.src.endsWith('assets/map/Bike_Geolocalisation_Map_web.jpg'), img.src);
      ok('bike map loads: no missing flag', !document.getElementById('map-wrapper').classList.contains('is-missing'));
    } else {
      const want = downhill ? 'Ski-Downhill_Geolocalisation-map_web.jpg' : 'Ski-Touring_geolocalisation_Map_web.jpg';
      ok('ski, ' + (downhill ? 'Descente' : 'Montée') + ': the view\'s own geolocalisation map, and no map switch (one map per view)', img.src.endsWith(want) && document.getElementById('map-switch').hidden === true, [img.src, document.getElementById('map-switch').hidden]);
      ok('ski: no map is calibrated yet -> no markers, explanation shown', document.querySelectorAll('.map-marker').length === 0 && /Carte non calibrée/.test(document.getElementById('map-count').textContent), document.getElementById('map-count').textContent);
      // both geolocalisation maps get calibrated (as the system admin does in Administration > Cartes): SIG2 (a downhill run, has a GPS position) belongs to Descente only
      window.__data.maps = [{ id: 'ski-geo', mode: 'affine', width: 800, height: 700, points: [ { x: 0, y: 0, lat: 45.296611, lon: -72.243361 }, { x: 800, y: 0, lat: 45.325861, lon: -72.249972 }, { x: 0, y: 700, lat: 45.299444, lon: -72.205667 }] }, { id: 'ski-downhill-geo', mode: 'affine', width: 1404, height: 932, points: [ { x: 0, y: 0, lat: 45.33, lon: -72.26 }, { x: 1404, y: 0, lat: 45.33, lon: -72.20 }, { x: 0, y: 932, lat: 45.29, lon: -72.26 }] }];
      await MapService.load(true); renderMapMarkers();
      ok('markers: the downhill report SIG2 is placed in Descente, not in Montée', document.querySelectorAll('.map-marker').length === (downhill ? 1 : 0) && (downhill ? /1 rapport\(s\) avec localisation/ : /0 rapport\(s\) avec localisation/).test(document.getElementById('map-count').textContent), [document.querySelectorAll('.map-marker').length, document.getElementById('map-count').textContent]);

      if (!downhill) { // the shared location pop-up does not depend on the view: tested once

      // ---- the location pop-up (shared module) ----
      const opened = []; const realOpen = window.open; window.open = (...a) => { opened.push(a[0]); };
      window.__data.maps = []; await MapService.load(true);
      openPhotoLocationModal(45.31, -72.23);
      ok('no calibrated map: the pop-up opens Google Maps instead', opened.length === 1 && /google\.com\/maps\?q=45\.31,-72\.23/.test(opened[0]) && !document.getElementById('photo-map-modal'), opened);
      window.__data.maps = [{ id: 'ski-geo', mode: 'affine', width: 800, height: 700, points: [
        { x: 0, y: 0, lat: 45.296611, lon: -72.243361 }, { x: 800, y: 0, lat: 45.325861, lon: -72.249972 }, { x: 0, y: 700, lat: 45.299444, lon: -72.205667 }] }];
      await MapService.load(true);
      openPhotoLocationModal(45.31, -72.23);
      const modal = document.getElementById('photo-map-modal'); const mimg = document.getElementById('photo-map-img');
      const mBtns = () => [...document.querySelectorAll('#photo-map-switch button')];
      ok('pop-up: opens on the DOWNHILL GEO map (default) although it is not calibrated; both buttons of the switch can be clicked', !!modal && modal.classList.contains('show') && mimg.getAttribute('src').endsWith('Ski-Downhill_Geolocalisation-map_web.jpg') && mBtns().length === 2 && mBtns().every(b => !b.disabled) && mBtns()[0].classList.contains('btn-primary'), [mimg.getAttribute('src'), mBtns().map(b => b.textContent + ':' + b.disabled)]);
      ok('pop-up on an uncalibrated map: no marker, an explanation, the Google Maps link stays', document.getElementById('photo-marker').style.display === 'none' && /ne peut pas être placée sur cette carte/.test(document.getElementById('photo-coords').textContent) && /google\.com\/maps\?q=45\.31,-72\.23/.test(document.getElementById('photo-google-link').href), [document.getElementById('photo-marker').style.display, document.getElementById('photo-coords').textContent]);
      mBtns()[1].click();
      ok('switching to the touring geo map (calibrated): marker placed with the GPS position, note gone', mimg.getAttribute('src').endsWith('Ski-Touring_geolocalisation_Map_web.jpg') && document.getElementById('photo-marker').style.display === '' && /^\d+px$/.test(document.getElementById('photo-marker').style.left) && /45\.310000/.test(document.getElementById('photo-coords').textContent) && !/ne peut pas être placée/.test(document.getElementById('photo-coords').textContent), [document.getElementById('photo-marker').style.left, document.getElementById('photo-coords').textContent]);
      PhotoMapModal.close();
      // calibrate the downhill geo map too: the switch works both ways
      window.__data.maps.push({ id: 'ski-downhill-geo', mode: 'affine', width: 1404, height: 932, points: [
        { x: 0, y: 0, lat: 45.33, lon: -72.26 }, { x: 1404, y: 0, lat: 45.33, lon: -72.20 }, { x: 0, y: 932, lat: 45.29, lon: -72.26 }] });
      await MapService.load(true);
      PhotoMapModal.close(); openPhotoLocationModal(45.31, -72.23);
      ok('both calibrated: the touring choice made earlier with the switch is kept (pinned)', mimg.getAttribute('src').endsWith('Ski-Touring_geolocalisation_Map_web.jpg') && mBtns().every(b => !b.disabled), [mimg.getAttribute('src'), mBtns().map(b => b.disabled)]);
      const touringLeft = document.getElementById('photo-marker').style.left;
      mBtns()[0].click();
      ok('pop-up switch to the downhill geo map (now calibrated): the marker sits at ITS position on that map', mimg.getAttribute('src').endsWith('Ski-Downhill_Geolocalisation-map_web.jpg') && document.getElementById('photo-marker').style.display === '' && document.getElementById('photo-marker').style.left !== touringLeft && mBtns()[0].classList.contains('btn-primary'), [mimg.getAttribute('src'), touringLeft, document.getElementById('photo-marker').style.left]);
      PhotoMapModal.close(); openPhotoLocationModal(45.312, -72.231);
      ok('the map picked with the switch is kept for the next position', mimg.getAttribute('src').endsWith('Ski-Downhill_Geolocalisation-map_web.jpg'), mimg.getAttribute('src'));
      window.open = realOpen;
      }
    }
  }
  if (/^signalisation-/.test(PAGE)) {
    const sw = document.getElementById('kind-switch');
    ok(bike ? 'bike: no Montée / Descente switch in the header' : 'ski: the Montée / Descente switch is in the header and shows the view (' + (downhill ? 'Descente' : 'Montée') + ')', bike ? sw.hidden === true : (sw.hidden === false && sw.textContent.includes(downhill ? 'Descente' : 'Montée')), sw.textContent);
  }
  // ---- Signalisations: permanent (the default) or temporary ("due à une condition temporaire") ----
  if (PAGE === 'signalisation-report') {
    const radio = id => document.getElementById(id);
    ok('duration: "Permanente" is chosen by default; "Temporaire" carries its explanation', radio('duration-permanent').checked && !radio('duration-temporary').checked && /Temporaire/.test(radio('duration-temporary').closest('label').textContent) && /due à une condition temporaire/.test(radio('duration-temporary').closest('label').textContent), null);
    const fillAndSave = async () => {
      sectorSelect.value = bike ? 'sentiers-velo' : 'mont-orford'; populateTrails();
      trailSelect.value = bike ? 'bike_1' : (downhill ? 'run_2' : 'trail_2'); statusSelect.value = 'ouverte';
      await handleSubmit({ preventDefault() {} });
      return window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'add');
    };
    window.__writes.length = 0; resetForm();
    let adds = await fillAndSave();
    ok('a report left on the default is saved as permanent', adds.length === 1 && adds[0][3].duration === 'permanent', adds);
    window.__writes.length = 0; resetForm();
    radio('duration-temporary').checked = true;
    adds = await fillAndSave();
    ok('a report marked temporary is saved as temporary', adds.length === 1 && adds[0][3].duration === 'temporary', adds);
    ok('after saving, the form is back on permanent', radio('duration-permanent').checked && !radio('duration-temporary').checked, null);
    // correcting a saved report
    const mineId = opts(reportSelector).find(v => v !== 'new');
    const saved = userReports.find(r => r.id === mineId);
    saved.duration = 'temporary'; reportSelector.value = mineId; handleReportChange();
    ok('opening a temporary report shows "Temporaire"; one saved before the choice existed shows "Permanente"', radio('duration-temporary').checked && (delete saved.duration, handleReportChange(), radio('duration-permanent').checked), null);
    radio('duration-temporary').checked = true; window.__writes.length = 0;
    await handleModify();
    const upd = window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'update');
    ok('modifying saves the duration chosen (and still never the network)', upd.length === 1 && upd[0][3].duration === 'temporary' && !('network' in upd[0][3]), upd);
  }
  if (PAGE === 'signalisation-resume') {
    const rowIds = () => [...document.querySelectorAll('#reports-tbody tr[data-id]')].map(r => r.dataset.id).sort();
    const sel = document.getElementById('filter-duration');
    const choose = v => { sel.value = v; sel.dispatchEvent(new Event('change')); };
    ok('the dashboard has a "Durée" selector: Permanentes et temporaires (the default), Permanentes, Temporaires', J(opts(sel)) === J(['both', 'permanent', 'temporary']) && sel.value === 'both' && /Permanentes et/.test(sel.options[0].textContent) && /Temporaires/.test(sel.options[2].textContent), [opts(sel), sel.value]);
    const all = rowIds();   // the default shows everything
    const target = reportsData[0];                 // one report is marked temporary in memory (the mock data stays as it is)
    target.duration = 'temporary';
    choose('permanent');
    ok('Permanentes: the temporary report is not listed (reports without the field are permanent)', !rowIds().includes(target.id) && rowIds().length === all.length - 1, rowIds());
    choose('temporary');
    const temporaryRow = document.querySelector(`#reports-tbody tr[data-id="${target.id}"]`);
    ok('Temporaires: only the temporary report, flagged "Temporaire" in the list, and the count follows', J(rowIds()) === J([target.id]) && /Temporaire/.test(temporaryRow.textContent) && /^1 rapport/.test(document.getElementById('reports-count').textContent), [rowIds(), document.getElementById('reports-count').textContent]);
    choose('both');
    ok('Permanentes et temporaires: all of them', rowIds().length === all.length && /Temporaire/.test(document.querySelector(`#reports-tbody tr[data-id="${target.id}"]`).textContent), rowIds());
    openDetailModal(target.id);
    ok('the report\'s detail says its duration and why', /Durée : temporaire \(due à une condition temporaire\)/.test(document.getElementById('modal-body').textContent), document.getElementById('modal-body').textContent.slice(0, 200));
    closeModal(); delete target.duration; choose('both');
  }
  if (PAGE === 'signalisation-admin') {
    // a report of this view (an earlier test may have moved the mock's own report to the other view)
    const first = { id: 'SIGDUR', status: 'ouverte', sector: bike ? 'sentiers-velo' : 'mont-orford', trail: bike ? 'Piste verte' : 'Adams', trailId: bike ? 'bike_1' : 'trail_2', comments: '', photos: [], resolved: false, archived: false, network: bike ? 'bike' : 'ski', createdAt: T(Date.now()), inspectorName: 'Test' };
    reportsData.push(first);
    const durSel = () => document.getElementById('admin-duration');
    const updatesNow = () => window.__writes.filter(x => x[0] === 'signalisations' && x[2] === 'update');
    window.__writes.length = 0;
    first.duration = 'temporary'; openDetail(first.id);
    ok('Gestion: a temporary report shows "Temporaire" and its selector is on Temporaire', /Temporaire/.test(document.getElementById('modal-body').textContent) && durSel().value === 'temporary' && /due à une condition temporaire/.test(durSel().options[1].textContent), durSel().value);
    delete first.duration; openDetail(first.id);
    ok('Gestion: a report without the field is permanent (selector on Permanente, no badge)', durSel().value === 'permanent' && !/badge-warning/.test(document.getElementById('modal-body').innerHTML), durSel().value);
    // the admin swaps permanent -> temporary -> permanent
    durSel().value = 'temporary'; await saveChanges(); await wait(200);
    ok('Gestion: swapping to Temporaire is saved with the report (and the activity is never sent)', updatesNow().length === 1 && updatesNow()[0][3].duration === 'temporary' && !('network' in updatesNow()[0][3]), updatesNow());
    first.duration = 'temporary'; reportsData.push(first); window.__writes.length = 0; openDetail(first.id);
    durSel().value = 'permanent'; await saveChanges(); await wait(200);
    ok('Gestion: swapping back to Permanente is saved', updatesNow().length === 1 && updatesNow()[0][3].duration === 'permanent', updatesNow());
  }
  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
