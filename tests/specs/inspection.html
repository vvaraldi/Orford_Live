<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;color:#000;font-size:11px;z-index:99999">running...</pre>
<script>
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const PAGE = Q.get('page');
  const opts = el => [...el.options].map(o => o.value);
  const bike = NET === 'bike' || (NET === 'both' && Q.get('choice') === 'bike');
  const downhill = Q.get('kind') === 'downhill'; // ?kind=downhill: this page load already starts on that kind
  const reads = () => window.__reads || [];
  const writesOf = name => window.__writes.flatMap(w => w[0] === 'batch' ? w[1].filter(op => op[0] === name && op[2] === 'set').map(op => op[3]) : (w[0] === name && w[2] === 'set' ? [w[3]] : []));
  await wait(900);
  ok('current activity is ' + (bike ? 'bike' : 'ski'), Network.current() === (bike ? 'bike' : 'ski'), Network.current());
  ok('confirm() and alert() are the browser\'s own synchronous ones (ui.js must not replace them with Promise-returning dialogs)', /\[native code\]/.test(Function.prototype.toString.call(window.confirm)) && /\[native code\]/.test(Function.prototype.toString.call(window.alert)) && typeof confirmDialog === 'function');

  // ---------- header: switcher + feature-gated nav (any page) ----------
  const sw = document.getElementById('network-switch');
  if (NET === 'both') {
    ok('switcher is shown for a user with two activities and shows the current one', sw && !sw.hidden && sw.textContent.includes(bike ? 'Vélo' : 'Ski'), sw && sw.textContent);
    ok('mobile drawer lists both activities, current one highlighted', document.querySelectorAll('#mobile-network a').length === 2 && document.querySelector('#mobile-network .mobile-nav__link--active').textContent.includes(bike ? 'Vélo' : 'Ski'));
    sw.click();
    const saved = JSON.parse(localStorage.getItem('orford-network') || 'null');
    ok('clicking the switcher stores the other activity and reloads', window.__reloads === 1 && saved && saved.id === (bike ? 'ski' : 'bike'), [window.__reloads, saved]);
  } else {
    if (Q.get('as') !== 'system') ok('switcher hidden for a single-activity user', sw && sw.hidden === true); // a system admin has every activity
  }
  const shelterLink = document.querySelector('.nav [data-requires="shelters"]');
  if (shelterLink) ok('shelter nav link follows the activity', (shelterLink.style.display === 'none') === bike, shelterLink.style.display);

  // ---------- pages ----------
  if (PAGE === 'inspection-dashboard') {
    const img = document.getElementById('map-image');
    if (!downhill) {
      // ---- default kind at load: Montée for ski, bike's only kind ----
      const trailMarkers = [...document.querySelectorAll('.map-marker:not(.map-marker--shelter)')].map(m => m.textContent).sort();
      ok('trail markers of this activity only; label = number field or id without prefix', J(trailMarkers) === J(bike ? ['2', '7'] : ['1', '2']), trailMarkers);
      ok('shelter markers only where shelters exist', document.querySelectorAll('.map-marker--shelter').length === (bike ? 0 : 1));
      ok('total trails stat', document.getElementById('stat-total').textContent === '2', document.getElementById('stat-total').textContent);
      ok(bike ? 'bike: shelters and shelter inspections are never read' : 'ski: shelters are read', bike ? (!reads().includes('shelters') && !reads().includes('shelter_inspections')) : reads().includes('shelters'), reads());
      const rows = document.querySelectorAll('#recent-inspections .inspection-row');
      ok('recent inspections of this activity only', rows.length === (bike ? 1 : 3), rows.length);
      ok('map image is this activity\'s', img.src.endsWith(bike ? 'assets/map/Bike_Map_web.jpg' : 'assets/map/Ski-Touring_Map.png'), img.src);
      ok((bike ? 'bike' : 'ski') + ' map loads: no missing flag', !document.getElementById('map-wrapper').classList.contains('is-missing'));

      // right-click on a trail goes straight to the trail report, trail + status to change to preselected
      const openTrail = allTrails.find(t => t.id === (bike ? 'bike_1' : 'trail_1'));    // status open
      const closedTrail = allTrails.find(t => t.id === (bike ? 'bike_2' : 'trail_2'));  // status closed
      ok('right-click on an open trail: report page with the trail and status=closed', reportUrlForTrail(openTrail, true) === `inspection-trail-report.html?trail=${openTrail.id}&status=closed`, reportUrlForTrail(openTrail, true));
      ok('right-click on a closed trail: report page with the trail and status=open', reportUrlForTrail(closedTrail, true) === `inspection-trail-report.html?trail=${closedTrail.id}&status=open`, reportUrlForTrail(closedTrail, true));
      ok('Inspection view: right-click on a trail preselects the trail only, whatever its status', reportUrlForTrail(openTrail) === `inspection-trail-report.html?trail=${openTrail.id}` && reportUrlForTrail(closedTrail) === `inspection-trail-report.html?trail=${closedTrail.id}`);
      const inspMarker = document.querySelector('.map-marker:not(.map-marker--shelter)');
      ok('Inspection view: trail markers have the right-click handler too', !!inspMarker && typeof inspMarker.oncontextmenu === 'function');
      ok('Inspection view: the hint speaks of trails' + (bike ? '' : ' and shelters'), !document.getElementById('map-hint').hidden && /un sentier/.test(document.getElementById('map-hint').textContent) && /ou un abri/.test(document.getElementById('map-hint').textContent) === !bike, document.getElementById('map-hint').textContent);
      ok('right-click on a trail of unknown status: the trail only, the status is left to the form', reportUrlForTrail({ id: 'x' }, true) === 'inspection-trail-report.html?trail=x', reportUrlForTrail({ id: 'x' }, true));
      ok('the old quick-toggle context menu is gone', !document.getElementById('context-menu') && typeof setTrailStatus === 'undefined');
      // 2.2: the dashboard reads the current season, never a whole inspection collection
      const seasonMs = +Network.seasonStart();
      const inspectionReads = (window.__queries || []).filter(q => /^(trail|shelter)_inspections$/.test(q.name));
      ok('dashboard: every inspection read has a start date (no whole-collection read)', inspectionReads.length > 0 && inspectionReads.every(q => q.where.some(w => w[0] === 'date' && w[1] === '>=')), inspectionReads);
      ok('dashboard: the main trail-inspections read starts exactly at the season start', inspectionReads.some(q => q.name === 'trail_inspections' && q.where.some(w => +w[2] === seasonMs)), inspectionReads);
      ok('dashboard: shelter inspections are read only where shelters exist', inspectionReads.some(q => q.name === 'shelter_inspections') === !bike, inspectionReads.map(q => q.name));
      ok('dashboard: the season is stated next to the map title', /(Saison en cours \(depuis le|Dernière saison \()/.test(document.getElementById('season-note').textContent) && document.getElementById('season-note').textContent.includes(Network.seasonLabel(Network.seasonRange())), document.getElementById('season-note').textContent);
      if (!bike) {
        // same for a shelter marker: the shelter report with that shelter preselected
        const shelterMarker = document.querySelector('.map-marker--shelter');
        ok('right-click on a shelter: shelter report with the shelter preselected', reportUrlForShelter(allShelters[0]) === 'inspection-shelter-report.html?shelter=shelter_1', reportUrlForShelter(allShelters[0]));
        ok('the shelter marker has the right-click handler', !!shelterMarker && typeof shelterMarker.oncontextmenu === 'function');
        ok('Inspection view: the hint speaks of shelters', !document.getElementById('map-hint').hidden && /un abri/.test(document.getElementById('map-hint').textContent), document.getElementById('map-hint').textContent);
      }
      // Statut view as a plain inspector (not admin): right-click on trails still works, the bulk buttons stay hidden
      isAdmin = false;
      const viewToggle = document.getElementById('view-toggle'); viewToggle.checked = true; toggleMapView();
      const statusMarker = document.querySelector('.map-marker:not(.map-marker--shelter)');
      ok('Statut view, non-admin: trail markers have the right-click handler', !!statusMarker && typeof statusMarker.oncontextmenu === 'function');
      ok('Statut view, non-admin: the hint speaks of trails and is visible', !document.getElementById('map-hint').hidden && /un sentier/.test(document.getElementById('map-hint').textContent), document.getElementById('map-hint').textContent);
      ok('Statut view, non-admin: the "Tout ouvrir / Tout fermer" buttons stay hidden', !document.getElementById('bulk-actions').classList.contains('show'));
      isAdmin = true; toggleMapView();
      ok('Statut view, admin: the bulk buttons are shown', document.getElementById('bulk-actions').classList.contains('show'));
      viewToggle.checked = false; toggleMapView();
    } else {
      // ---- ski, started on Descente (?kind=downhill): Kind.current() is read once at load ----
      const trailMarkers = [...document.querySelectorAll('.map-marker:not(.map-marker--shelter)')].map(m => m.textContent).sort();
      ok('downhill: only the downhill trail markers (run_2 has no position yet)', J(trailMarkers) === J(['20']), trailMarkers);
      ok('downhill: no shelter marker (shelters are on the touring map only)', document.querySelectorAll('.map-marker--shelter').length === 0);
      ok('downhill: stats count both downhill trails, even the one without a position', document.getElementById('stat-total').textContent === '2', document.getElementById('stat-total').textContent);
      ok('downhill: the downhill map is shown', img.src.endsWith('assets/map/Ski-Downhill_Map_web.jpg'), img.src);
      ok('downhill: the last-7-days list is the downhill\'s own - none of the Montée trails\' or the shelter\'s inspections (none exist for the runs in this mock)', document.querySelectorAll('#recent-inspections .inspection-row').length === 0 && /Aucune inspection/.test(document.getElementById('recent-inspections').textContent), document.getElementById('recent-inspections').textContent);

      // 1.9 regression: the photo-location popup must use the DOWNHILL GEO map while viewing
      // Descente, not the network's default (touring) map - was a real bug, found while discussing
      // consolidation. Since the downhill/status and downhill-geo/GPS split, this is the geo map.
      window.__data.maps = [{ id: 'ski-downhill-geo', mode: 'affine', width: 1404, height: 932, points: [
        { x: 0, y: 0, lat: 45.33, lon: -72.26 }, { x: 1404, y: 0, lat: 45.33, lon: -72.20 }, { x: 0, y: 932, lat: 45.29, lon: -72.26 }] }];
      await MapService.load(true);
      openPhotoLocationModal(45.31, -72.23);
      await wait(200);
      const photoImg = document.querySelector('#photo-map-wrap img');
      ok('1.9: photo location on Descente uses the downhill geo map, not the touring one', photoImg && photoImg.getAttribute('src').endsWith('Ski-Downhill_Geolocalisation-map_web.jpg'), photoImg && photoImg.getAttribute('src'));
      PhotoMapModal.close();
    }

    // ---- kind switch (shared header control, kind.js + layout.js): uphill vs downhill for ski,
    // bike has one kind. Switching itself is a page reload - kind.js's own unit test (t-kind.html)
    // covers the persisted-choice logic; this only checks the button reflects Kind.current().
    const kSw = document.getElementById('kind-switch');
    if (bike) {
      ok('bike: no kind switch (only one inspected kind)', kSw && kSw.hidden === true);
    } else {
      const label = downhill ? 'Descente' : 'Montée';
      ok('ski: kind switch shows the current kind (' + label + ')', kSw && kSw.hidden === false && kSw.textContent.includes(label), kSw && kSw.textContent);
      ok('mobile drawer lists both kinds, the current one highlighted', document.querySelectorAll('#mobile-kind a').length === 2 && document.querySelector('#mobile-kind .mobile-nav__link--active').textContent.includes(label));
      const reloadsBefore = window.__reloads;
      kSw.click();
      const savedKind = JSON.parse(localStorage.getItem('orford-kind') || 'null');
      const next = downhill ? 'uphill' : 'downhill';
      ok('clicking the kind switch stores "' + next + '" for this network and reloads', window.__reloads === reloadsBefore + 1 && savedKind && savedKind.kind === next && savedKind.network === 'ski', [window.__reloads, savedKind]);
    }
  }

  // Opened from the dashboard's right-click (?trail=<id>&status=open|closed): trail + status preselected
  if (PAGE === 'inspection-trail-report' && Q.get('trail')) {
    const wantTrail = Q.get('trail'), wantStatus = Q.get('status');
    const checkedStatus = () => (form.querySelector('input[name="trail-status"]:checked') || {}).value;
    if (!downhill) {
      // Montée / bike: one sector, so the sector step is skipped and the trail is picked in the flat list
      await wait(300);
      ok('preselection (flat list): the trail is selected', trailSelect.value === wantTrail, trailSelect.value);
      ok('preselection: the status to change to is ticked - not the trail\'s current one', checkedStatus() === wantStatus, checkedStatus());
      ok('preselection: that trail\'s issue checklist is shown', document.getElementById('issues-hint').hidden === true && document.getElementById('issues-group').hidden === false);
      ok('preselection: nothing else is filled in for the inspector (the general condition is still to choose)', !form.querySelector('input[name="condition"]:checked'));
    } else {
      // Descente: make it span two sectors (as the downhill test below), re-run the page's own load
      window.__data.sectors.push({ id: 'test-extra-sector', name: 'Secteur test', network: 'ski', order: 99, aliases: [] });
      window.__data.trails.push({ id: 'run_extra', name: 'Piste test', kind: 'downhill', network: 'ski', sector: 'test-extra-sector', status: 'open' });
      await SectorService.loadAll(true);
      await SectorService.loadTrails(true);
      await loadSectors();
      await wait(300);
      ok('preselection (sector step): the trail\'s sector is selected', document.getElementById('sector-group').hidden === false && sectorSelect.value === 'test-extra-sector', sectorSelect.value);
      ok('preselection (sector step): the trail is selected', trailSelect.value === wantTrail, trailSelect.value);
      ok('preselection (sector step): the status to change to is ticked', checkedStatus() === wantStatus, checkedStatus());
    }
  }

  if (PAGE === 'inspection-trail-report' && !downhill && !Q.get('trail')) {
    // Montée (and bike) each have exactly one sector in this mock ("Randonnée alpine" in
    // production, "mont-orford"/"sentiers-velo" here): a sector step would never narrow anything
    // down, so it is skipped - flat, alphabetical list instead, orphans included (La tortue,
    // which has no sector at all, is reachable here - unlike in the sector-first case below).
    ok('single-sector kind: the sector step is skipped', document.getElementById('sector-group').hidden === true, document.getElementById('sector-group').hidden);
    ok('trail list = this activity\'s inspected trails of the shown kind, flat, orphans included', J(opts(trailSelect)) === J(bike ? ['', 'bike_2', 'bike_1'] : ['', 'trail_2', 'trail_1']), opts(trailSelect));
    ok('trail picker text: name + difficulty in the new words + length only when known (the flat-list style, not the sector picker\'s plain-name one)', J([...trailSelect.options].slice(1).map(o => o.textContent)) === J(bike ? ['Descente (Noire · 4 km)', 'Piste verte (Verte · 3 km)'] : ['Adams (Noire · 2 km)', 'La tortue (Verte · 1.1 km)']), [...trailSelect.options].map(o => o.textContent));
    const snow = document.getElementById('snow-condition-group');
    ok('snow condition question only for ski', (snow.style.display === 'none') === bike, snow.style.display);
    ok('no trail selected yet: hint shown, no checklist', document.getElementById('issues-hint').hidden === false && document.getElementById('issues-group').hidden === true, document.getElementById('issues-group').innerHTML);
    trailSelect.value = bike ? 'bike_1' : 'trail_1';
    trailSelect.dispatchEvent(new Event('change'));
    await wait(300);
    const expectedIssues = APP_CONFIG.trailKinds[bike ? 'bike' : 'uphill'].issues;
    const shownIssues = [...document.querySelectorAll('#issues-group input[type=checkbox]')].map(c => c.value);
    ok('issue checklist matches the selected trail\'s kind (' + (bike ? 'bike' : 'uphill') + ')', document.getElementById('issues-hint').hidden === true && document.getElementById('issues-group').hidden === false && J(shownIssues) === J(expectedIssues), shownIssues);
    document.getElementById('status-open').checked = true;
    document.getElementById('condition-good').checked = true;
    document.getElementById('snow-good').checked = true; // ticked even where hidden: must be ignored for bike
    await handleSubmit({ preventDefault() {} });
    const w = writesOf('trail_inspections');
    ok('inspection saved with network', w.length === 1 && w[0].network === (bike ? 'bike' : 'ski'), w);
    ok('snow condition saved for ski, ignored for bike', bike ? w[0].snow_condition === null : w[0].snow_condition === 'good', w[0] && w[0].snow_condition);
  }

  if (PAGE === 'inspection-trail-report' && downhill && !Q.get('trail')) {
    // Started on Descente (?kind=downhill): today's mock also gives downhill only one sector
    // (mont-orford), so it is ALSO the flat-list case here, same reasoning as Montée above -
    // just happens to list the same 2 runs as the old sector-agnostic assertion did.
    ok('downhill also has only one sector in this mock: sector step skipped, flat list', document.getElementById('sector-group').hidden === true && J(opts(trailSelect)) === J(['', 'run_2', 'run_1']), [document.getElementById('sector-group').hidden, opts(trailSelect)]);

    // ---- Force the OTHER branch: once a kind spans more than one sector, the sector step must
    // appear. Inject a second sector + a downhill trail in it (nothing else in the mock touched),
    // force SectorService's per-page cache to refresh, then re-run the page's own loadSectors().
    window.__data.sectors.push({ id: 'test-extra-sector', name: 'Secteur test', network: 'ski', order: 99, aliases: [] });
    window.__data.trails.push({ id: 'run_extra', name: 'Piste test', kind: 'downhill', network: 'ski', sector: 'test-extra-sector', status: 'open' });
    await SectorService.loadAll(true);
    await SectorService.loadTrails(true);
    await loadSectors();
    ok('once downhill spans 2 sectors, the sector step appears', document.getElementById('sector-group').hidden === false, document.getElementById('sector-group').hidden);
    ok('the new sector is offered alongside the existing one', opts(sectorSelect).includes('mont-orford') && opts(sectorSelect).includes('test-extra-sector'), opts(sectorSelect));
    sectorSelect.value = 'test-extra-sector';
    sectorSelect.dispatchEvent(new Event('change'));
    ok('picking the new sector shows only its own downhill trail', J(opts(trailSelect)) === J(['', 'run_extra']), opts(trailSelect));

    sectorSelect.value = 'mont-orford';
    sectorSelect.dispatchEvent(new Event('change'));
    trailSelect.value = 'run_1';
    trailSelect.dispatchEvent(new Event('change'));
    await wait(300);
    const shownIssues = [...document.querySelectorAll('#issues-group input[type=checkbox]')].map(c => c.value);
    ok('downhill: issue checklist is the downhill list', J(shownIssues) === J(APP_CONFIG.trailKinds.downhill.issues), shownIssues);
  }

  // Opened from the dashboard's right-click on a shelter (?shelter=<id>): the shelter is preselected
  if (PAGE === 'inspection-shelter-report' && Q.get('shelter')) {
    await wait(300);
    ok('preselection: the shelter is selected', shelterSelect.value === Q.get('shelter'), shelterSelect.value);
    ok('preselection: nothing else is filled in for the inspector', !form.querySelector('input[name="condition"]:checked'));
  }

  if (PAGE === 'inspection-shelter-report' && !Q.get('shelter')) {
    if (bike) {
      ok('bike: form replaced by a notice', document.getElementById('shelter-inspection-form').style.display === 'none' && document.body.textContent.includes("Il n'y a pas d'abris"));
      ok('bike: shelters are never read', !reads().includes('shelters'), reads());
    } else if (downhill) {
      // Started on Descente: shelters live on the touring map only, so the form is replaced too
      ok('ski, downhill: form replaced by a "not in this view" notice', document.getElementById('shelter-inspection-form').style.display === 'none' && document.body.textContent.includes("Il n'y a pas d'abris en vue « Descente »"), document.body.textContent);
    } else {
      ok('ski: shelter list', J(opts(shelterSelect)) === J(['', 'shelter_1']), opts(shelterSelect));
      shelterSelect.value = 'shelter_1';
      ['condition', 'cleanliness', 'accessibility'].forEach(n => { form.querySelector(`input[name="${n}"]`).checked = true; });
      await handleSubmit({ preventDefault() {} });
      const w = writesOf('shelter_inspections');
      ok('ski: shelter inspection saved with network', w.length === 1 && w[0].network === 'ski', w);
    }
  }

  if (PAGE === 'inspection-history' && !downhill) {
    ok('history lists this activity\'s inspections of the shown kind, INCLUDING the one on a hidden trail (history is kept)', allInspections.length === (bike ? 1 : 4) && (bike || allInspections.some(i => i.id === 'IA1' && i.location === 'Ancien sentier')), allInspections.map(i => i.id + ':' + i.location));
    // Deleting an inspection is reserved to the system admin (the Firestore rules say the same)
    const deleteButtons = document.querySelectorAll('button[onclick^="deleteInspection"]').length;
    ok(Q.get('as') === 'system' ? 'system admin: the inspections have the delete button' : 'admin / inspector: no delete button on any row', Q.get('as') === 'system' ? deleteButtons > 0 : deleteButtons === 0, deleteButtons);
    // 2.2: Historique opens on the current season; the whole history is read once, only when a period needs it
    const seasonMs = +Network.seasonStart();
    const histReads = () => (window.__queries || []).filter(q => /^(trail|shelter)_inspections$/.test(q.name));
    ok('history: opens on the current season, and only that season is read', document.getElementById('date-filter').value === 'season' && document.getElementById('season-option').textContent === Network.seasonLabel(Network.seasonRange()) && histReads().length > 0 && histReads().every(q => q.where.some(w => w[0] === 'date' && w[1] === '>=' && +w[2] === seasonMs)), histReads());
    const dateFilter = document.getElementById('date-filter');
    const readsBefore = histReads().length;
    dateFilter.value = 'today'; dateFilter.dispatchEvent(new Event('change')); await wait(400);
    ok('history: a period inside the season (today) reads nothing more', histReads().length === readsBefore, [histReads().length, readsBefore]);
    dateFilter.value = 'all'; dateFilter.dispatchEvent(new Event('change')); await wait(600);
    ok('history: "Toutes les saisons" reads the whole history, once', histReads().slice(readsBefore).some(q => q.name === 'trail_inspections' && q.where.length === 0) && allInspections.length === (bike ? 1 : 4), histReads().slice(readsBefore));
    const readsAfterAll = histReads().length;
    dateFilter.value = 'month'; dateFilter.dispatchEvent(new Event('change')); await wait(400);
    ok('history: once the full history is loaded, other periods do not read again', histReads().length === readsAfterAll, [histReads().length, readsAfterAll]);
    ok('type filter has "shelter" only where shelters exist', (opts(document.getElementById('type-filter')).includes('shelter')) === !bike, opts(document.getElementById('type-filter')));
  }

  if (PAGE === 'inspection-history' && downhill) {
    // No downhill-run inspection exists yet in this mock: only the (kind-agnostic) shelter one shows
    ok('downhill: trail inspections scoped to downhill (none yet), shelter inspections still show (not kind-specific)', allInspections.length === 1 && allInspections[0].type === 'shelter', allInspections.map(i => i.id + ':' + i.type));
  }

  if (PAGE === 'inspection-admin' && !downhill) {
    ok('statistics cover this activity\'s inspections of the shown kind (a hidden trail\'s inspections still count)', trailInspections.length === (bike ? 1 : 3) && shelterInspections.length === (bike ? 0 : 1), [trailInspections.length, shelterInspections.length]);
    ok('season start follows the activity\'s season (bike 1 May, ski 1 Nov)', seasonStart.getMonth() === (bike ? 4 : 10) && seasonStart.getDate() === 1, seasonStart);
    const range = Network.seasonRange();
    ok('the season ends on its last day (bike 31 Oct, ski 30 Apr)', range.end.getMonth() === (bike ? 9 : 3) && range.end.getDate() === (bike ? 31 : 30), range.end);
    ok('bike and ski share the same map centre', MAP_CENTER && MAP_CENTER.lat === 45.31 && MAP_CENTER.lon === -72.23, MAP_CENTER);
    const card = document.getElementById('stat-shelter-inspections').closest('.stat-card');
    ok('shelter statistic hidden without shelters', (card.style.display === 'none') === bike);
    // bike now has a map centre too, so the outlier check runs; this mock's bike inspection has no photo
    if (bike) ok('bike: outlier check runs (map centre set) but finds no GPS photo in this mock', document.getElementById('outlier-photo-container').textContent.includes('Aucune photo'), document.getElementById('outlier-photo-container').textContent);
  }

  if (PAGE === 'inspection-admin' && downhill) {
    ok('downhill: trail statistics scoped to downhill (none yet in this mock), shelter statistics stay network-wide (data management must not be kind-scoped)', trailInspections.length === 0 && shelterInspections.length === 1, [trailInspections.length, shelterInspections.length]);
  }

  if (PAGE === 'inspection-admin') {
    // "Gestion des données" text must say plainly what each tool reaches, so nobody assumes a
    // delete is limited to whatever kind is selected in the header when it plainly is not.
    const deleteDesc = document.getElementById('delete-desc').textContent;
    const orphanDesc = document.getElementById('orphan-desc').textContent;
    const dbDesc = document.getElementById('db-desc').textContent;
    ok('delete tool: says which activity, and (for ski) that it covers every kind regardless of the header', deleteDesc.includes(`« ${Network.config().name} »`) && (bike ? !/Montée|Descente/.test(deleteDesc) : /Montée et Descente/.test(deleteDesc) && /vue sélectionnée/.test(deleteDesc)), deleteDesc);
    ok('orphan cleanup: says it is NOT scoped to the current activity (reads the whole database)', /TOUTES les activités/.test(orphanDesc) && orphanDesc.includes(`« ${Network.config().name} »`), orphanDesc);
    ok('db stats: says it is NOT scoped to the current activity either', /TOUTES les données stockées/.test(dbDesc) && /tous réseaux confondus/.test(dbDesc), dbDesc);

    // ---- season navigator (Statistiques tab): mirrors the app's own season math so the
    // expectations are correct regardless of network (ski/bike anchor on different dates) or
    // today's real date, rather than hardcoding assumptions that would rot ----
    const seasonLabelEl = document.getElementById('season-label');
    const prevBtn = document.getElementById('season-prev');
    const nextBtn = document.getElementById('season-next');
    const floorDate = (() => { const e = APP_CONFIG.earliestSeasonStart; return new Date(e.year, e.month - 1, e.day); })();
    const currentStart = () => Network.seasonRange().start;
    const startOf = offset => { const a = currentStart(); return new Date(a.getFullYear() - offset, a.getMonth(), a.getDate()); };

    ok('starts on the current season: label says so, "Next" disabled (no future data)', (Network.seasonRange().active ? /Saison en cours/ : /Dernière saison/).test(seasonLabelEl.textContent) && nextBtn.disabled === true, seasonLabelEl.textContent);
    const canGoBackOnce = startOf(1) >= floorDate;
    ok('"Previous" is enabled iff a season exists on/after config.js\'s earliestSeasonStart (winter 2025-2026)', prevBtn.disabled === !canGoBackOnce, [prevBtn.disabled, canGoBackOnce, startOf(1).toISOString(), floorDate.toISOString()]);

    if (canGoBackOnce) {
      prevBtn.click();
      await wait(300);
      const oneBack = seasonLabelEl.textContent;
      ok('"Previous" once: label now names a past season (a year range), "Next" becomes enabled', /^Saison \d{4}(-\d{4})? \(/.test(oneBack) && !/en cours/.test(oneBack) && nextBtn.disabled === false, oneBack);
      const canGoBackTwice = startOf(2) >= floorDate;
      ok('"Previous" now reflects whether going back once MORE would cross the earliest reachable season', prevBtn.disabled === !canGoBackTwice, [prevBtn.disabled, canGoBackTwice]);
      nextBtn.click();
      await wait(300);
      ok('"Next": back to the current season, "Next" disabled again', (Network.seasonRange().active ? /Saison en cours/ : /Dernière saison/).test(seasonLabelEl.textContent) && nextBtn.disabled === true, seasonLabelEl.textContent);
    } else {
      ok('"Previous" click is a no-op when already at the earliest reachable season (disabled button)', prevBtn.disabled === true);
    }
    // 3.1 wording: a past bike season is one calendar year (May-Oct), a past ski winter spans two
    const past = seasonLabel(seasonBounds(1));
    ok('past season label: ' + (bike ? 'bike = one year ("Saison 2025 (1 mai 2025 – 31 oct. 2025)")' : 'ski = two years ("Saison 2024-2025 (1 nov. 2024 – 30 avr. 2025)")'), bike ? /^Saison \d{4} \(/.test(past) && !/^Saison \d{4}-\d{4}/.test(past) : /^Saison \d{4}-\d{4} \(/.test(past), past);
    ok('past season label spells out the season\'s own dates (bike May to October, ski November to April)', bike ? /mai.*oct/i.test(past) : /nov.*avr/i.test(past), past);
    ok('no script errors from repeatedly re-rendering the charts (season navigation calls renderCharts() every time)', window.__errs.length === 0, window.__errs);
  }
  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
