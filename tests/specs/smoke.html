<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;color:#000;font-size:11px;z-index:99999">running...</pre>
<script>
(async () => {
  const out = []; const J = JSON.stringify;
  const ok = (n, c, x) => out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : ' :: ' + J(x)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const PAGE = Q.get('page'); const AS = Q.get('as') || 'admin';
  const opts = el => [...el.options].map(o => o.value);
  await wait(900);
  ok('no script errors on load', window.__errs.length === 0, window.__errs);
  ok('header rendered', !!document.querySelector('header.header') && !!document.getElementById('mobile-nav'));
  // Only the logo and the name (REGIS) lead back to the portal; the app's name beside it is plain text
  const logoLink = document.querySelector('header .logo__link');
  const appName = document.querySelector('header .logo__app');
  ok('header: logo + REGIS are the portal link, and the link holds nothing else', !!logoLink && /index\.html$/.test(logoLink.getAttribute('href')) && logoLink.textContent.trim() === APP_CONFIG.branding.name, logoLink && logoLink.textContent);
  ok(appName ? 'header: the app name beside REGIS is NOT part of any link' : 'header: portal-level page, no app name', appName ? !appName.closest('a') && !logoLink.contains(appName) && appName.textContent === document.querySelector('header .logo__rest').textContent.replace(/\s*-\s*/, '') : !document.querySelector('header .logo__rest'), appName && appName.textContent);
  const drawerName = document.querySelector('#mobile-nav .logo__name');
  const drawerApp = document.querySelector('#mobile-nav .logo__app');
  ok('mobile menu: the name is the portal link, the app name under it is not', !!drawerName && /index\.html$/.test(drawerName.getAttribute('href')) && drawerName.textContent === APP_CONFIG.branding.name && (!drawerApp || !drawerApp.closest('a')), [drawerName && drawerName.textContent, drawerApp && drawerApp.closest('a')]);
  ok('confirm() and alert() are the browser\'s own synchronous ones (ui.js must not replace them with Promise-returning dialogs)', /\[native code\]/.test(Function.prototype.toString.call(window.confirm)) && /\[native code\]/.test(Function.prototype.toString.call(window.alert)) && typeof confirmDialog === 'function');
  ok('current activity set (' + Network.current() + ')', !!Network.current());

  if (PAGE === 'index') {
    const cards = [...document.querySelectorAll('#app-grid .app-card')].map(c => c.className.match(/app-card--(\w+)/)[1]);
    ok('portal shows the app cards', cards.includes('inspection') && cards.includes('infraction') && cards.includes('signalisation') && cards.includes('support') && cards.includes('status'), cards);
  }

  if (PAGE === 'user-management') {
    const sys = AS === 'system';
    ok('the temporary data initialisation is gone (no section, no function)', !document.getElementById('backfill-section') && typeof backfillDataNetworks === 'undefined');
    ok('export activity list (Données is system admin only): all, then the activities', JSON.stringify([...document.getElementById('export-network').options].map(o => o.value)) === JSON.stringify(['', ...(sys || NET === 'both' ? ['ski', 'bike'] : [NET])]));
    const shown = [...document.querySelectorAll('.admin-tabs__btn')].filter(b => b.style.display !== 'none').map(b => b.dataset.tab);
    ok('Sentiers, Cartes and Données tabs: system admin only', ['trails', 'maps', 'data'].every(t => shown.includes(t) === sys), shown);
    ok('the Import tab is gone', !document.querySelector('[data-tab="import"]') && !document.getElementById('import-tab'));
    if (sys) {
      ok('Sentiers tab starts on the activity chosen in the portal (a system admin has one too)', document.getElementById('trail-network').value === Network.current(), [document.getElementById('trail-network').value, Network.current()]);
    } else {
      switchTab('trails');
      ok('a plain admin cannot open Sentiers even by script', !document.getElementById('trails-tab').classList.contains('is-active'));
      switchTab('users');
    }
    // The users list is paginated: 25 per page to start, page-size selector, "Affichage de X à Y sur N"
    {
      const real = users.slice(); const sel = document.getElementById('users-page-size');
      const rowsNow = () => document.querySelectorAll('#users-tbody tr').length;
      const pager = document.getElementById('users-pagination'), info = document.getElementById('users-pagination-info');
      ok('users list: page size selector offers 10/25/50/100, 25 by default', J([...sel.options].map(o => o.value)) === J(['10', '25', '50', '100']) && sel.value === '25' && usersPageSize === 25, [sel.value, usersPageSize]);
      ok('users list: few users -> everything on one page, no pager', real.length > 25 || (pager.style.display === 'none' && rowsNow() === filteredUsers.length), [real.length, rowsNow(), pager.style.display]);
      for (let i = 0; i < 60; i++) users.push({ id: 'fake' + i, name: 'Zed Fake ' + String(i).padStart(2, '0'), email: 'fake' + i + '@example.test', role: 'inspector', status: 'active', networks: ['ski', 'bike'] });
      const total = users.length;
      filterAndRenderUsers();
      ok('users list: 25 rows per page and the pager is shown', rowsNow() === 25 && pager.style.display !== 'none' && info.textContent === `Affichage de 1 à 25 sur ${total}`, [rowsNow(), info.textContent]);
      ok('users list: the total shown above the table stays the full filtered count', new RegExp('\\b' + total + '\\b').test(document.getElementById('users-count').textContent), document.getElementById('users-count').textContent);
      goToUsersPage(2);
      ok('users list: page 2 shows the next rows', usersPage === 2 && info.textContent === `Affichage de 26 à ${Math.min(50, total)} sur ${total}` && document.querySelector('#users-pagination-buttons .page-btn.active').textContent === '2', info.textContent);
      filterAndRenderUsers(true);
      ok('users list: refreshing after an edit stays on the current page', usersPage === 2, usersPage);
      sel.value = '10'; sel.dispatchEvent(new Event('change'));
      ok('users list: changing the page size goes back to page 1 with that many rows', usersPage === 1 && rowsNow() === 10 && info.textContent === `Affichage de 1 à 10 sur ${total}`, [usersPage, rowsNow(), info.textContent]);
      const search = document.getElementById('search-users'); search.value = 'zed fake 0'; filterAndRenderUsers();
      ok('users list: a search narrows the list and hides the pager when it fits on one page', filteredUsers.length === 10 && pager.style.display === 'none' && rowsNow() === 10, [filteredUsers.length, rowsNow(), pager.style.display]);
      search.value = ''; filterAndRenderUsers(); goToUsersPage(Math.ceil(total / 10));
      ok('users list: the last page shows the remainder', info.textContent === `Affichage de ${(Math.ceil(total / 10) - 1) * 10 + 1} à ${total} sur ${total}` && document.querySelector('#users-pagination-buttons .page-btn:last-child').disabled, info.textContent);
      ok('users list: the export still takes every filtered user, not just the page', filteredUsers.length === total, filteredUsers.length);
      users.length = 0; real.forEach(u => users.push(u)); sel.value = '25'; sel.dispatchEvent(new Event('change'));
    }
    // The bulk import now lives in Utilisateurs, between the user list and the export box
    const kids = [...document.getElementById('users-tab').children];
    const at = sel => kids.findIndex(k => k.matches(sel));
    ok('bulk import block: in Utilisateurs, between the user list and the user export', at('.user-table-section') < at('#import-section') && at('#import-section') < at('.data-export-section:not(#import-section)'), kids.map(k => k.id || k.className));
    // The downloadable CSV template is coherent with a user profile: every field an import can set is a column, and every row is read back correctly
    const header = CSV_TEMPLATE.split('\n')[0].split(',');
    const profileFields = ['name', 'email', 'password', 'role', 'phone', 'allowInspection', 'allowInfraction', 'allowSignalisation', 'allowMaintenance', 'networks'];
    ok('CSV template: one column per profile field the import can set', J(header) === J(profileFields), header);
    parseCsv(CSV_TEMPLATE);
    const got = parsedUsers.map(u => [u.name, u.role, u.phone, u.allowInspection, u.allowInfraction, u.allowSignalisation, u.allowMaintenance, u.networks.join('|')]);
    if (sys) {
      ok('CSV template: the 3 example rows are read back as written', J(got) === J([
        ['Jean Dupont', 'inspector', '514-555-1234', true, false, false, false, 'ski'],
        ['Sophie Gagnon', 'inspector', '', true, false, false, true, 'bike'],
        ['Marie Tremblay', 'admin', '', true, true, true, false, 'ski|bike']]), got);
    } else {
      ok('CSV template: the 3 example rows are read, activities limited to the importing admin\'s own', got.length === 3 && got.every(g => g[7].split('|').every(id => myNetworks().includes(id)) || g[7] === ''), got);
    }
    if (sys) {
      // Données: the Entretien logs are exported too (JSON keeps the logs; CSV has one row per work entry)
      // the export starts at the start of the activity's latest season (ski 1 Nov, bike 1 May); "all" = the earliest
      const ymd = d => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
      const netSel = document.getElementById('export-network'), startInput = document.getElementById('export-start-date');
      const pick = v => { netSel.value = v; netSel.dispatchEvent(new Event('change')); return startInput.value; };
      ok('export: start date = start of the latest season (all activities: the earliest; ski: 1 Nov; bike: 1 May)', pick('') === ymd(new Date(Math.min(+Network.seasonStart('ski'), +Network.seasonStart('bike')))) && pick('ski') === ymd(Network.seasonStart('ski')) && pick('bike') === ymd(Network.seasonStart('bike')) && /-11-01$/.test(pick('ski')) && /-05-01$/.test(pick('bike')), [pick(''), pick('ski'), pick('bike')]);
      pick('');
      const files = {}; downloadFile = (content, name) => { files[name] = content; };
      ['trail-inspections', 'shelter-inspections', 'infractions', 'signalisations'].forEach(id => { document.getElementById('export-' + id).checked = false; });
      document.getElementById('export-start-date').value = '2020-01-01';
      document.getElementById('export-data-format').value = 'json'; await exportData(); await wait(300);
      const json = JSON.parse(Object.entries(files).find(([n]) => /\.json$/.test(n))[1]);
      ok('export: Entretien option exists and is ticked by default', !!document.getElementById('export-maintenance'));
      ok('export JSON: the Entretien log with its 2 work entries, people and readable dates', json.maintenanceLogs.length === 1 && json.maintenanceLogs[0].entries.length === 2 && json.maintenanceLogs[0].volunteerNames.join() === 'Ann,Bob' && typeof json.maintenanceLogs[0].date === 'string' && typeof json.maintenanceLogs[0].entries[0].photos[0].timestamp === 'string' && json.summary.maintenanceLogsCount === 1 && json.trailInspections === undefined, json.summary);
      document.getElementById('export-data-format').value = 'csv'; await exportData(); await wait(2800); // the CSV files are written 0.5 s apart
      const csvName = Object.keys(files).find(n => /_Entretien\.csv$/.test(n));
      const rows = csvName ? files[csvName].replace('﻿', '').split('\n') : [];
      ok('export CSV: one row per work entry, photo links, people joined', rows.length === 3 && /photoUrls/.test(rows[0]) && /Drainage, ajout de dalots/.test(rows[1]) && /1\.jpg \| https:\/\/example\.test\/2\.jpg/.test(rows[1]) && /Ann \| Bob/.test(rows[1]) && /Reprofilage/.test(rows[2]), rows);
    }
    const tabs = [...document.querySelectorAll('.admin-tabs__btn')];
    ok('"Liens et astuces" is the last tab, on the far right', tabs[tabs.length - 1].dataset.tab === 'links' && /Liens et astuces/.test(tabs[tabs.length - 1].textContent), tabs.map(t => t.dataset.tab));
    const pub = document.getElementById('link-public-status');
    ok('public status link: clear text, same as the clickable address, opens in a new tab', /\/pages\/public-status\.html$/.test(pub.textContent) && pub.href === pub.textContent && pub.target === '_blank', [pub.textContent, pub.href]);
    const bikeAdmin = sys || NET === 'bike' || NET === 'both';
    const card = document.getElementById('links-volunteer-card');
    ok('volunteer registration card only for bike admins', card.hidden === !bikeAdmin, card.hidden);
    // Bénévoles tab: the sign-up limits of the public registration page (counters, limits, switch, reset)
    if (bikeAdmin) {
      const val = id => document.getElementById(id).value;
      const setVal = (id, v) => { document.getElementById(id).value = v; };
      ok('Bénévoles tab: limits card shows the defaults (10 / 60 / 150 / 500, open) and the counters at zero', val('vl-per-minute') === '10' && val('vl-per-hour') === '60' && val('vl-per-day') === '150' && val('vl-total') === '500' && document.getElementById('vl-enabled').checked && /0 \/ 10/.test(document.getElementById('vl-status').textContent) && /0 \/ 500/.test(document.getElementById('vl-status').textContent), document.getElementById('vl-status').textContent);
      const limitWrites = () => window.__writes.filter(w => w[0] === 'volunteerLimits');
      const nativeConfirm = window.confirm; window.confirm = () => true;
      setVal('vl-per-minute', '0'); document.getElementById('vl-save-btn').click(); await wait(100);
      ok('invalid limit (0): nothing is saved', limitWrites().length === 0, limitWrites());
      setVal('vl-per-minute', '5'); setVal('vl-per-hour', '30'); setVal('vl-per-day', '100'); setVal('vl-total', '300'); document.getElementById('vl-enabled').checked = false;
      document.getElementById('vl-save-btn').click(); await wait(100);
      const cfgW = limitWrites().find(w => w[1] === 'config');
      ok('save: the config document gets the 4 limits as numbers and the switch', !!cfgW && cfgW[2] === 'set' && cfgW[3].perMinute === 5 && cfgW[3].perHour === 30 && cfgW[3].perDay === 100 && cfgW[3].total === 300 && cfgW[3].enabled === false, cfgW);
      document.getElementById('vl-reset-btn').click(); await wait(100);
      const stW = limitWrites().find(w => w[1] === 'state');
      ok('reset: the counters document is rewritten with zeros (limits untouched)', !!stW && stW[3].total === 0 && stW[3].minuteCount === 0 && stW[3].hourCount === 0 && stW[3].dayCount === 0 && limitWrites().filter(w => w[1] === 'config').length === 1, stW);
      window.confirm = nativeConfirm;
    }
    if (bikeAdmin) {
      const vol = document.getElementById('link-volunteer');
      ok('volunteer link: clear text and clickable', /\/pages\/maintenance-volunteer-register\.html$/.test(vol.textContent) && vol.href === vol.textContent && vol.target === '_blank', vol.textContent);
      ok('volunteer QR code is drawn, with a download link', !!document.querySelector('#links-volunteer-qr svg') && document.getElementById('links-volunteer-qr-download').hidden === false, document.getElementById('links-volunteer-qr').innerHTML.slice(0, 80));
    }
  }
  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'HARNESS ERROR ' + e.stack; });
</script>
