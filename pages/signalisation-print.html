<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fiche des signalisations actives">
  <meta name="theme-color" content="#f59e0b">
  <title>Fiche des signalisations</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* The sheet: a list of the active signs, to print or to follow on a phone while inspecting or setting up */
    .sheet { max-width: 900px; margin: 0 auto; background: var(--theme-surface); border: 1px solid var(--theme-border); border-radius: var(--radius-lg); padding: 1.25rem; }
    .sheet-tools { max-width: 900px; margin: 0 auto 0.75rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .sheet-tools__hint { font-size: 0.8125rem; color: var(--theme-text-secondary); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 2px solid var(--theme-border); padding-bottom: 0.75rem; margin-bottom: 0.75rem; }
    .sheet-head h1 { font-size: 1.6rem; margin: 0; }
    .sheet-logo { max-height: 56px; max-width: 45%; width: auto; object-fit: contain; }
    .sheet-filters { font-size: 0.875rem; margin: 0 0 1rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
    .sheet-filters b { font-weight: 600; }
    .sector-title { font-size: 1rem; font-weight: 700; margin: 1.25rem 0 0.25rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--theme-border); }
    .sign { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 7.5rem; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px dashed var(--theme-border); break-inside: avoid; page-break-inside: avoid; }
    .sign__photos { display: flex; flex-wrap: wrap; gap: 0.5rem; align-content: flex-start; }
    .sign__photo { width: 76px; font-size: 0.7rem; }
    .sign__thumb { display: block; width: 76px; height: 76px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--theme-border); cursor: zoom-in; }
    .sign__nophoto { font-size: 0.8rem; color: var(--theme-text-secondary); }
    .sign .photo-location { margin-top: 0.15rem; font-size: 0.7rem; line-height: 1.3; }
    .sign .photo-location a { color: var(--theme-accent); margin-right: 0.35rem; white-space: nowrap; }
    .sign__trail { font-weight: 600; }
    .sign__comment { font-size: 0.85rem; white-space: pre-wrap; margin-top: 0.2rem; overflow-wrap: anywhere; }
    .sign__side { text-align: right; font-size: 0.85rem; }
    .sign__date { margin-top: 0.3rem; color: var(--theme-text-secondary); white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 600; }
    .badge--temporary { background: #fef3c7; color: #92400e; }
    .badge--permanent { background: #e5e7eb; color: #374151; }
    .sheet-empty { text-align: center; padding: 2rem 0; color: var(--theme-text-secondary); }
    .sheet-total { margin: 0.75rem 0 0; font-size: 0.8125rem; color: var(--theme-text-secondary); }
    @media (max-width: 640px) {
      .sheet { padding: 0.75rem; }
      .sign { grid-template-columns: minmax(0, 1fr) 6rem; }
      .sign__photos { grid-column: 1 / -1; order: 3; }
    }

    /* On paper: the sheet alone (the header, menus and buttons are already hidden by the site's print rules) */
    @media print {
      .skip-link, .no-print { display: none !important; }
      .main { padding: 0 !important; margin: 0 !important; max-width: none !important; }
      .sheet { max-width: none; border: 0; border-radius: 0; padding: 0; background: #fff; }
      .sign .photo-location { display: none; }
      .sign__thumb { width: 64px; height: 64px; border-color: #999; }
      .sign__photo { width: 64px; }
      .sector-title { break-after: avoid; page-break-after: avoid; }
      @page { margin: 12mm; }
    }

    /* Photo-location pop-up (js/services/photo-map-modal.js builds its own markup; these are its rules) */
    .detail-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .detail-modal.show { display: flex; }
    .detail-modal__content { background: var(--theme-surface); border-radius: var(--radius-lg); max-width: 600px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
    .detail-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--theme-border); }
    .detail-modal__title { font-size: 1.125rem; font-weight: 600; }
    .detail-modal__close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--theme-text-secondary); }
    .detail-modal__body { padding: 1rem; overflow-y: auto; flex: 1; }
    .detail-modal__footer { display: flex; gap: 1rem; justify-content: flex-end; padding: 1rem; border-top: 1px solid var(--theme-border); }
  </style>
</head>
<body data-theme="light" data-module="signalisation" data-nav="signalisation" data-page="signalisation-print">
  <script src="../js/core/config.js"></script>
  <script src="../js/core/network.js"></script>
  <script src="../js/core/kind.js"></script>
  <script src="../js/core/layout.js"></script>
  <div id="loading" class="page-loading"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>

  <main id="main-content" class="main" style="display:none;">
    <div class="sheet-tools no-print">
      <button type="button" class="btn btn-primary" id="print-btn">🖨️ Imprimer</button>
      <span class="sheet-tools__hint">Touchez une photo pour la voir en grand. 📍 Carte et 🗺️ situent la photo (non imprimés).</span>
    </div>

    <article class="sheet" id="sheet">
      <header class="sheet-head">
        <h1>Signalisations</h1>
        <img class="sheet-logo" id="sheet-logo" alt="Mont Orford">
      </header>
      <p class="sheet-filters" id="sheet-filters"></p>
      <div id="sheet-list"><p class="sheet-empty">Chargement...</p></div>
      <p class="sheet-total" id="sheet-total"></p>
    </article>
  </main>

  <script src="../js/core/utils.js"></script>
  <script src="../js/core/period-filter.js"></script>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/firebase-loader.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/services/photo-service.js"></script>
  <script src="../js/services/map-service.js"></script>
  <script src="../js/services/photo-map-modal.js"></script>
  <script src="../js/services/sector-service.js"></script>
  <script src="../js/services/trail-service.js"></script>

  <script>
    // The filters come in the address, from the dashboard's "Fiche à imprimer" button:
    //   ?sector=<id>&trail=<id or name:...>&duration=both|permanent|temporary&period=all|season|today|week|month|custom&start=&end=
    // Active signs only (not resolved, not archived), of the activity and the Montée / Descente view shown.
    const addressParams = new URLSearchParams(location.search);
    const DURATIONS = { both: 'Permanentes et temporaires', permanent: 'Permanentes', temporary: 'Temporaires' };
    const paramSector = addressParams.get('sector') || '';
    const paramTrail = addressParams.get('trail') || '';
    const paramDuration = DURATIONS[addressParams.get('duration')] ? addressParams.get('duration') : 'both';
    const paramPeriod = PeriodFilter.fromParams(addressParams);

    let sectors = [];
    let allTrails = [];
    let reports = [];

    const sectorNameOf = r => SectorService.nameOf(sectors, r.sector, r.sectorDisplayName);
    const reportTrailKey = r => r.trailId || ('name:' + (r.trail || ''));
    const isTemporary = r => r.duration === 'temporary';
    const sameSector = (a, b) => a === b || (!!a && !!b && (SectorService.find(sectors, a) || {}).id !== undefined && (SectorService.find(sectors, a) || {}).id === (SectorService.find(sectors, b) || {}).id);
    const dayText = d => d ? d.toLocaleDateString('fr-CA', { year: 'numeric', month: 'short', day: 'numeric' }) : '';

    // Which map a record's photos default to (same rule as the dashboard)
    function geoMapFor(record) {
      const sector = SectorService.find(sectors, record.sector);
      const trail = sector && sector.items.find(i => i.id === record.trailId);
      if (trail) return TrailService.geoMapIdOf(trail.kind);
      if (sector && sector.items.length) {
        const kinds = new Set(sector.items.map(i => i.kind));
        if (kinds.size === 1) return TrailService.geoMapIdOf([...kinds][0]);
      }
      return null;
    }

    function initSignalisationPrint() {
      checkAuthStatus({
        requireAuth: true,
        requiredPermission: 'allowSignalisation',
        permissionDefault: false,
        onAuthenticated: async () => {
          const logo = document.getElementById('sheet-logo');
          if (BRANDING.logoImage) logo.src = siteUrl(BRANDING.logoImage); else logo.remove();
          document.getElementById('print-btn').addEventListener('click', () => window.print());
          try {
            sectors = await SectorService.load();
            allTrails = await SectorService.loadTrails();
          } catch (e) {
            console.error('Error loading sectors:', e);
          }
          await MapService.load();
          await loadReports();
        }
      });
    }

    async function loadReports() {
      const list = document.getElementById('sheet-list');
      try {
        let found;
        try {
          const snap = await db.collection('signalisations').where('resolved', '==', false).where('archived', '==', false).orderBy('createdAt', 'desc').get();
          found = []; snap.forEach(doc => found.push({ id: doc.id, ...doc.data() }));
        } catch (e) {
          // no index for the combined query: read them all and keep the active ones
          const snap = await db.collection('signalisations').orderBy('createdAt', 'desc').get();
          found = []; snap.forEach(doc => { const d = doc.data(); if (d.resolved !== true && d.archived !== true) found.push({ id: doc.id, ...d }); });
        }
        found = found.filter(r => r.resolved !== true && r.archived !== true && Network.matches(r));
        reports = SectorService.inKinds(sectors, allTrails, found, TrailService.viewKinds());
        render();
      } catch (e) {
        console.error('Error loading reports:', e);
        list.innerHTML = '<p class="sheet-empty" style="color:#ef4444;">Erreur de chargement</p>';
      }
    }

    function selected() {
      let rows = reports.filter(r => paramDuration === 'both' || (paramDuration === 'temporary') === isTemporary(r));
      if (paramSector) rows = rows.filter(r => sameSector(r.sector, paramSector));
      if (paramTrail) rows = rows.filter(r => reportTrailKey(r) === paramTrail);
      rows = rows.filter(r => PeriodFilter.matches(PeriodFilter.lastChange(r), paramPeriod));
      // by sector, then trail, then the most recently changed first
      return rows.sort((a, b) =>
        sectorNameOf(a).localeCompare(sectorNameOf(b), 'fr') ||
        (a.trail || '').localeCompare(b.trail || '', 'fr') ||
        ((PeriodFilter.lastChange(b) || 0) - (PeriodFilter.lastChange(a) || 0)));
    }

    function filtersHtml() {
      const trailRow = paramTrail ? reports.find(r => reportTrailKey(r) === paramTrail) : null;
      const sectorText = paramSector ? SectorService.nameOf(sectors, paramSector, paramSector) : 'Tous';
      const trailText = paramTrail ? (trailRow ? trailRow.trail : paramTrail.replace(/^name:/, '')) : 'Toutes';
      const parts = [
        ['Secteur', sectorText], ['Piste / Sentier', trailText],
        ['Durée', DURATIONS[paramDuration]], ['Période', PeriodFilter.label(paramPeriod)]
      ];
      if (typeof Kind !== 'undefined' && Kind.ids().length > 1) parts.unshift(['Vue', TrailService.kindLabel(Kind.current())]);
      return parts.map(([k, v]) => `<span>${escapeHtml(k)} : <b>${escapeHtml(v)}</b></span>`).join('');
    }

    function signHtml(r) {
      const photos = PhotoService.photosFrom(r);
      const preferredMap = geoMapFor(r);
      const photosHtml = photos.length
        ? photos.map(p => `<div class="sign__photo"><img class="sign__thumb" src="${escapeHtml(p.url)}" alt="Photo" loading="lazy" onclick="window.open(this.src, '_blank')">${PhotoMapModal.locationLinks(p, { collection: 'signalisations', docId: r.id, record: r, preferredMap, onChanged: loadReports })}</div>`).join('')
        : '<span class="sign__nophoto">Aucune photo</span>';
      const temporary = isTemporary(r);
      return `<div class="sign" data-id="${escapeHtml(r.id)}">
        <div class="sign__photos">${photosHtml}</div>
        <div><div class="sign__trail">${escapeHtml(r.trail || '-')}</div>${r.comments ? `<div class="sign__comment">${escapeHtml(r.comments)}</div>` : ''}</div>
        <div class="sign__side"><span class="badge ${temporary ? 'badge--temporary' : 'badge--permanent'}">${temporary ? 'Temporaire' : 'Permanente'}</span><div class="sign__date">${escapeHtml(dayText(PeriodFilter.lastChange(r)))}</div></div>
      </div>`;
    }

    function render() {
      document.getElementById('sheet-filters').innerHTML = filtersHtml();
      const rows = selected();
      const list = document.getElementById('sheet-list');
      if (!rows.length) {
        list.innerHTML = '<p class="sheet-empty">Aucune signalisation active pour ces filtres.</p>';
      } else {
        let html = '', last = null;
        rows.forEach(r => {
          const name = sectorNameOf(r);
          if (name !== last) { html += `<h2 class="sector-title">${escapeHtml(name)}</h2>`; last = name; }
          html += signHtml(r);
        });
        list.innerHTML = html;
      }
      document.getElementById('sheet-total').textContent = `${rows.length} signalisation(s) active(s) · fiche du ${dayText(new Date())}`;
    }

    onFirebaseReady(initSignalisationPrint);
  </script>
</body>
</html>
