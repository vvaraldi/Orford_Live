<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redirection…</title>
  <!--
    STOPGAP - NOT part of the app. Publish this file on the OLD site, at
      https://vvaraldi.github.io/Orford_Patrouille/pages/reset-password.html
    (repository vvaraldi/Orford_Patrouille, folder pages/, GitHub Pages on).

    Why: the password-reset e-mail still links to that old address (Firebase console > Authentication > Templates >
    "Customize action URL"), and Google currently blocks editing the e-mail templates of this project. This page only
    forwards the visitor, with the whole link (?mode=resetPassword&oobCode=...), to the real reset page of the app.

    When Firebase lets the template be edited again: set the action URL to the app's own page
    (https://regis-orford.github.io/Regis/pages/new-password.html) and delete this file from the old site.
  -->
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1b4b72; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; padding: 1rem; }
    a { color: #1b4b72; font-weight: 600; }
  </style>
</head>
<body>
  <p id="msg">Redirection vers la page de réinitialisation du mot de passe…<br>
    <noscript>Si la redirection ne se fait pas, <a href="https://regis-orford.github.io/Regis/pages/forgot-password.html">demandez un nouveau lien</a>.</noscript></p>
  <script>
    // The real page (case matters: /Regis/). The query string carries the one-time code; the hash is kept as well.
    var target = 'https://regis-orford.github.io/Regis/pages/new-password.html' + window.location.search + window.location.hash;
    window.location.replace(target);
    // If the browser blocks the automatic redirect, leave a link
    setTimeout(function () {
      document.getElementById('msg').innerHTML = 'Continuez vers <a href="' + target.replace(/"/g, '&quot;') + '">la page de réinitialisation du mot de passe</a>.';
    }, 3000);
  </script>
</body>
</html>
